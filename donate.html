<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Firm Ground Homes: Donate</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&amp;family=Source+Sans+3:wght@400;600;700&amp;display=swap">
<style>
body{margin:0;background:#FBF6EC;color:#2B2A28;font-family:'Source Sans 3',system-ui,sans-serif;font-size:18px;line-height:1.6}
a{color:#1F5C5A}
a:hover{text-decoration:underline}
a:focus-visible{outline:3px solid #A8481F;outline-offset:3px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid #A8481F;outline-offset:2px}
.btn:hover{text-decoration:none}
.btn-clay:hover{background:#8C3A15 !important}
.btn-teal:hover{background:#134240 !important}
.btn-line:hover{background:#E3EEEA !important}
.btn-cream:hover{background:#F3EAD8 !important}
</style>
</head>
<body>
<template id="dc-tpl">

<div style="width: 100%; background: #FBF6EC; color: #2B2A28; font-family: 'Source Sans 3', system-ui, sans-serif; font-size: 18px; line-height: 1.6">

<div style="background: #2B2A28; color: #FBF6EC; font-size: 15px; line-height: 1.4; padding: 10px 24px; text-align: center"><strong>Concept site.</strong> Firm Ground Homes is a fictional organization created as a design sample.</div>

<header style="max-width: 1120px; margin: 0 auto; padding: 20px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 32px">
<a href="index.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #1F5C5A">
<svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="10" fill="#1F5C5A"/><path d="M9 18 L18 10 L27 18 M12 17v9h12v-9" fill="none" stroke="#FBF6EC" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
<span style="font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 24px; line-height: 1.1">Firm Ground Homes</span>
</a>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 20px">
<a href="about.html" style="padding: 10px 6px; color: #2B2A28; font-weight: 600; font-size: 17px; text-decoration: none">About</a>
<a href="programs.html" style="padding: 10px 6px; color: #2B2A28; font-weight: 600; font-size: 17px; text-decoration: none">Programs</a>
<a href="apply.html" style="padding: 10px 6px; color: #2B2A28; font-weight: 600; font-size: 17px; text-decoration: none">How to apply</a>
<a href="referral.html" style="padding: 10px 6px; color: #2B2A28; font-weight: 600; font-size: 17px; text-decoration: none">For referral partners</a>
<a href="volunteer.html" style="padding: 10px 6px; color: #2B2A28; font-weight: 600; font-size: 17px; text-decoration: none">Volunteer</a>
<a href="faq.html" style="padding: 10px 6px; color: #2B2A28; font-weight: 600; font-size: 17px; text-decoration: none">Questions</a>
<a href="donate.html" aria-current="page" style="padding: 10px 6px; color: #1F5C5A; font-weight: 700; font-size: 17px; text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 8px; text-decoration-color: #A8481F">Donate</a>
</nav>
</header>

<main>
<section style="max-width: 1120px; margin: 0 auto; padding: 48px 24px 64px; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 48px">

<div style="flex: 1 1 380px; min-width: 0">
<p style="margin: 0 0 12px; font-size: 14px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #A8481F">Donate</p>
<h1 style="margin: 0 0 20px; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: clamp(38px, 5.5vw, 58px); line-height: 1.1; color: #1F5C5A">Help someone find firm footing.</h1>
<p style="margin: 0 0 18px; max-width: 30em; font-size: 21px; line-height: 1.5; color: #3B3935">Every gift helps pay for housing, job support and the basics that help a neighbor get steady. Give once or every month.</p>
<p style="margin: 0; max-width: 30em; font-weight: 600">$175 covers one week of housing for one resident. (Sample figures.)</p>
</div>

<div style="flex: 1 1 480px; min-width: 0; background: #FFFDF8; border: 1px solid #E6D9BF; border-top: 6px solid #A8481F; border-radius: 20px; padding: 32px">

<sc-if value="{{ showConfirm }}" hint-placeholder-val="{{ false }}">
<div role="status" style="background: #E3EEEA; border: 2px solid #1F5C5A; border-radius: 16px; padding: 28px">
<svg width="40" height="40" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="13" fill="#1F5C5A"/><path d="M8 14.5l4 4 8-9" fill="none" stroke="#FBF6EC" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
<p style="margin: 12px 0 10px; font-size: 20px; line-height: 1.5; font-weight: 600">{{ thanksText }}</p>
<p style="margin: 0 0 20px; font-size: 17px; line-height: 1.5">On a live site, this opens a secure checkout. No payment is taken here. (Concept site.)</p>
<button type="button" onClick="{{ reset }}" style="min-height: 44px; padding: 0 20px; border-radius: 999px; border: 2px solid #1F5C5A; background: transparent; color: #1F5C5A; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer">Reset the sample gift</button>
</div>
</sc-if>

<sc-if value="{{ showForm }}" hint-placeholder-val="{{ true }}">
<div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 20px">
<h2 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 28px; line-height: 1.2; color: #2B2A28">Make a gift</h2>
<span style="display: inline-block; padding: 2px 12px; border: 1.5px solid #1F5C5A; border-radius: 999px; font-size: 14px; font-weight: 700; color: #1F5C5A">Sample figures</span>
</div>

<div style="display: flex; gap: 0; margin-bottom: 24px; border: 2px solid #1F5C5A; border-radius: 999px; overflow: hidden">
<button type="button" onClick="{{ pickOnce }}" aria-pressed="{{ isOnce }}" style="flex: 1 1 50%; min-height: 48px; border: 0; background: {{ onceBg }}; color: {{ onceColor }}; font-family: inherit; font-size: 17px; font-weight: 700; cursor: pointer">Give once</button>
<button type="button" onClick="{{ pickMonthly }}" aria-pressed="{{ isMonthly }}" style="flex: 1 1 50%; min-height: 48px; border: 0; background: {{ monthlyBg }}; color: {{ monthlyColor }}; font-family: inherit; font-size: 17px; font-weight: 700; cursor: pointer">Give monthly</button>
</div>

<fieldset style="border: 0; padding: 0; margin: 0 0 8px; min-width: 0">
<legend style="padding: 0; margin-bottom: 12px; font-weight: 700">Choose an amount</legend>
<sc-for list="{{ options }}" as="opt" hint-placeholder-count="5">
<button type="button" onClick="{{ opt.pick }}" aria-pressed="{{ opt.selected }}" style="display: flex; width: 100%; align-items: center; gap: 16px; text-align: left; box-sizing: border-box; min-height: 64px; margin: 0 0 12px; padding: 12px 18px; border-radius: 14px; border: 2px solid {{ opt.border }}; background: {{ opt.bg }}; color: #2B2A28; font-family: inherit; font-size: 17px; line-height: 1.4; cursor: pointer">
<span style="flex: none; min-width: 76px; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 26px; color: #1F5C5A">{{ opt.amount }}</span>
<span style="flex: 1 1 auto">{{ opt.desc }}</span>
<sc-if value="{{ opt.selected }}" hint-placeholder-val="{{ false }}">
<svg width="26" height="26" viewBox="0 0 28 28" aria-hidden="true" style="flex: none"><circle cx="14" cy="14" r="13" fill="#1F5C5A"/><path d="M8 14.5l4 4 8-9" fill="none" stroke="#FBF6EC" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
</sc-if>
</button>
</sc-for>
</fieldset>

<sc-if value="{{ isOther }}" hint-placeholder-val="{{ false }}">
<div style="margin: 4px 0 20px">
<label for="custom-amount" style="display: block; margin-bottom: 6px; font-weight: 700">Your amount, in dollars</label>
<input id="custom-amount" type="text" inputmode="decimal" placeholder="For example, 40" value="{{ custom }}" onChange="{{ onCustom }}" aria-invalid="{{ amountError }}" style="display: block; width: 100%; box-sizing: border-box; min-height: 52px; padding: 0 16px; border: 2px solid {{ customBorder }}; border-radius: 12px; background: #FFFFFF; color: #2B2A28; font-family: inherit; font-size: 18px">
<sc-if value="{{ amountError }}" hint-placeholder-val="{{ false }}">
<p role="alert" style="margin: 8px 0 0; color: #8C3A15; font-size: 16px; font-weight: 700">Please enter an amount of $1 or more.</p>
</sc-if>
</div>
</sc-if>

<sc-if value="{{ isMonthly }}" hint-placeholder-val="{{ false }}">
<p style="margin: 0 0 20px; padding: 14px 18px; background: #F4EAD6; border-radius: 12px; font-size: 16px; line-height: 1.5">Monthly gifts help us plan ahead. You can change or cancel anytime.</p>
</sc-if>

<button type="button" onClick="{{ give }}" style="display: flex; align-items: center; justify-content: center; width: 100%; box-sizing: border-box; min-height: 58px; padding: 0 32px; border-radius: 999px; border: 2px solid #A8481F; background: #A8481F; color: #FFFFFF; font-family: inherit; font-size: 19px; font-weight: 700; cursor: pointer">{{ giveLabel }}</button>
<p style="margin: 14px 0 0; font-size: 14px; line-height: 1.5; color: #55524C">Concept site: no payment is taken.</p>
</div>
</sc-if>
</div>

</section>

<section style="background: #F4EAD6; padding: 56px 24px">
<div style="max-width: 1120px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 28px 40px">
<div style="flex: 1 1 280px; min-width: 0; display: flex; gap: 16px; align-items: flex-start">
<div style="flex: none; width: 52px; height: 52px; border-radius: 16px; background: #FFFDF8; display: flex; align-items: center; justify-content: center">
<svg width="30" height="30" viewBox="0 0 40 40" aria-hidden="true"><path d="M8 20a12 12 0 0 1 20-8l4 4 M32 20a12 12 0 0 1-20 8l-4-4 M32 8v8h-8 M8 32v-8h8" fill="none" stroke="#1F5C5A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
</div>
<div>
<h2 style="margin: 0 0 4px; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 22px; line-height: 1.2; color: #2B2A28">Once or every month</h2>
<p style="margin: 0; font-size: 17px; line-height: 1.5">Choose what fits your budget. Every amount helps.</p>
</div>
</div>
<div style="flex: 1 1 280px; min-width: 0; display: flex; gap: 16px; align-items: flex-start">
<div style="flex: none; width: 52px; height: 52px; border-radius: 16px; background: #FFFDF8; display: flex; align-items: center; justify-content: center">
<svg width="30" height="30" viewBox="0 0 40 40" aria-hidden="true"><rect x="5" y="9" width="30" height="22" rx="3" fill="none" stroke="#1F5C5A" stroke-width="2.4" stroke-linejoin="round"/><path d="M6 12l14 11 14-11" fill="none" stroke="#1F5C5A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
</div>
<div>
<h2 style="margin: 0 0 4px; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 22px; line-height: 1.2; color: #2B2A28">A receipt by email</h2>
<p style="margin: 0; font-size: 17px; line-height: 1.5">Keep it for your records and your taxes.</p>
</div>
</div>
<div style="flex: 1 1 280px; min-width: 0; display: flex; gap: 16px; align-items: flex-start">
<div style="flex: none; width: 52px; height: 52px; border-radius: 16px; background: #FFFDF8; display: flex; align-items: center; justify-content: center">
<svg width="30" height="30" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="14" fill="none" stroke="#1F5C5A" stroke-width="2.4"/><path d="M20 12v9l6 3" fill="none" stroke="#1F5C5A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
</div>
<div>
<h2 style="margin: 0 0 4px; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 22px; line-height: 1.2; color: #2B2A28">Change or cancel anytime</h2>
<p style="margin: 0; font-size: 17px; line-height: 1.5">Monthly gifts are never locked in.</p>
</div>
</div>
</div>
</section>

<section style="max-width: 1120px; margin: 0 auto; padding: 72px 24px">
<div style="display: flex; flex-wrap: wrap; gap: 32px 56px; align-items: flex-start">
<div style="flex: 1 1 280px; min-width: 0">
<p style="margin: 0 0 12px; font-size: 14px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #A8481F">Tax information</p>
<h2 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: clamp(30px, 4vw, 40px); line-height: 1.15; color: #1F5C5A">Is my gift tax-deductible?</h2>
</div>
<div style="flex: 2 1 420px; min-width: 0; max-width: 40em">
<p style="margin: 0 0 18px">Gifts may be tax-deductible to the extent allowed by law. After you give, we email a receipt that includes our tax ID. [Legal name and tax ID go here.]</p>
<p style="margin: 0; padding: 14px 18px; border: 1.5px dashed #8F8575; border-radius: 12px; font-size: 16px; line-height: 1.5; color: #3B3935"><strong>Concept note:</strong> <em>Client to confirm donation platform, tax status and receipt wording with their accountant or counsel.</em></p>
</div>
</div>
</section>
<section style="max-width: 1120px; margin: 0 auto; padding: 0 24px 56px"><p style="margin: 0; font-size: 18px">Prefer to give supplies? See the <a href="wishlist.html">wishlist</a>. Curious where gifts go? See our <a href="impact.html">impact and transparency</a> page.</p></section>
</main>

<footer style="background: #2B2A28; color: #F3EAD8; padding: 56px 24px 40px">
<div style="max-width: 1120px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 32px 56px">
<div style="flex: 1 1 260px; min-width: 0">
<div style="font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 24px; color: #FBF6EC; margin-bottom: 8px">Firm Ground Homes</div>
<p style="margin: 0; font-size: 16px; line-height: 1.5">Steady ground while you rebuild.</p>
</div>
<div style="flex: 1 1 260px; min-width: 0">
<h2 style="margin: 0 0 8px; font-size: 16px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #F4C46B">Need help right now?</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.5">Call or text 988, or dial 211 for local services.</p>
</div>
<div style="flex: 1 1 260px; min-width: 0">
<h2 style="margin: 0 0 8px; font-size: 16px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #F4C46B">Accessibility</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.5">We build this site to meet WCAG 2.1 AA. If something is hard to use, tell us and we will fix it.</p>
</div>
</div>
<p style="max-width: 1120px; margin: 40px auto 0; padding-top: 20px; border-top: 1px solid #55524C; font-size: 14px; line-height: 1.5; color: #D9CFBB">Concept site. Firm Ground Homes is a fictional organization. All numbers, quotes and images are samples or placeholders.</p>
</footer>

</div>
</template>
<div id="app"></div>
<script src="assets/dc-lite.js"></script>
<script>
class Component extends DCLogic {
state = { freq: 'once', choice: 175, custom: '', tried: false, done: false };

amountValue() {
const s = this.state;
if (s.choice === 'other') {
const n = parseFloat(String(s.custom).replace(/[^0-9.]/g, ''));
return isFinite(n) ? n : 0;
}
return s.choice;
}

renderVals() {
const s = this.state;
const v = this.amountValue();
const fmt = (n) => '$' + (Math.round(n * 100) / 100).toLocaleString('en-US');
const monthly = s.freq === 'monthly';
const defs = [
{ id: 25, amount: '$25', desc: 'A week of bus passes for one resident' },
{ id: 50, amount: '$50', desc: 'Work clothes for an interview and a first week on the job' },
{ id: 175, amount: '$175', desc: 'One week of housing for one resident' },
{ id: 700, amount: '$700', desc: 'Four weeks of housing for one resident' },
{ id: 'other', amount: 'Other', desc: 'Every amount helps. Your gift goes where it is needed most.' }
];
const amountError = s.tried && s.choice === 'other' && v < 1;
return {
options: defs.map((o) => {
const sel = s.choice === o.id;
return {
amount: o.amount,
desc: o.desc,
selected: sel,
border: sel ? '#1F5C5A' : '#8F8575',
bg: sel ? '#E3EEEA' : '#FFFFFF',
pick: () => this.setState({ choice: o.id, tried: false })
};
}),
isOnce: !monthly,
isMonthly: monthly,
onceBg: monthly ? '#FFFFFF' : '#1F5C5A',
onceColor: monthly ? '#1F5C5A' : '#FFFFFF',
monthlyBg: monthly ? '#1F5C5A' : '#FFFFFF',
monthlyColor: monthly ? '#FFFFFF' : '#1F5C5A',
pickOnce: () => this.setState({ freq: 'once' }),
pickMonthly: () => this.setState({ freq: 'monthly' }),
isOther: s.choice === 'other',
custom: s.custom,
onCustom: (e) => this.setState({ custom: e.target.value }),
amountError,
customBorder: amountError ? '#A8481F' : '#8F8575',
giveLabel: v >= 1 ? 'Give ' + fmt(v) + (monthly ? ' monthly' : ' once') : 'Give',
give: () => {
if (this.amountValue() >= 1) {
this.setState({ done: true, tried: false });
} else {
this.setState({ tried: true });
}
},
showForm: !s.done,
showConfirm: s.done,
thanksText: 'Thank you for choosing to give ' + fmt(v) + (monthly ? ' every month.' : ' once.'),
reset: () => this.setState({ done: false, tried: false })
};
}
}
DC.mount(Component);
</script>
<noscript><p style="padding:24px">This sample form needs JavaScript.</p></noscript>
</body>
</html>
