<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Firm Ground Homes: For Referral Partners</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&amp;family=Source+Sans+3:wght@400;600;700&amp;display=swap">
<style>
body{margin:0;background:#FBF6EC;color:#2B2A28;font-family:'Source Sans 3',system-ui,sans-serif;font-size:18px;line-height:1.6}
a{color:#1F5C5A}
a:hover{text-decoration:underline}
a:focus-visible{outline:3px solid #A8481F;outline-offset:3px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid #A8481F;outline-offset:2px}
.btn:hover{text-decoration:none}
.btn-clay:hover{background:#8C3A15 !important}
.btn-teal:hover{background:#134240 !important}
.btn-line:hover{background:#E3EEEA !important}
.btn-cream:hover{background:#F3EAD8 !important}
</style>
</head>
<body>
<template id="dc-tpl">

<div style="width: 100%; background: #FBF6EC; color: #2B2A28; font-family: 'Source Sans 3', system-ui, sans-serif; font-size: 18px; line-height: 1.6">

<div style="background: #2B2A28; color: #FBF6EC; font-size: 15px; line-height: 1.4; padding: 10px 24px; text-align: center"><strong>Concept site.</strong> Firm Ground Homes is a fictional organization created as a design sample.</div>

<header style="max-width: 1120px; margin: 0 auto; padding: 20px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 32px">
<a href="index.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #1F5C5A">
<svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="10" fill="#1F5C5A"/><path d="M9 18 L18 10 L27 18 M12 17v9h12v-9" fill="none" stroke="#FBF6EC" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
<span style="font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 24px; line-height: 1.1">Firm Ground Homes</span>
</a>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 20px">
<a href="about.html" style="padding: 10px 6px; color: #2B2A28; font-weight: 600; font-size: 17px; text-decoration: none">About</a>
<a href="programs.html" style="padding: 10px 6px; color: #2B2A28; font-weight: 600; font-size: 17px; text-decoration: none">Programs</a>
<a href="apply.html" style="padding: 10px 6px; color: #2B2A28; font-weight: 600; font-size: 17px; text-decoration: none">How to apply</a>
<a href="referral.html" aria-current="page" style="padding: 10px 6px; color: #1F5C5A; font-weight: 700; font-size: 17px; text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 8px; text-decoration-color: #A8481F">For referral partners</a>
<a href="volunteer.html" style="padding: 10px 6px; color: #2B2A28; font-weight: 600; font-size: 17px; text-decoration: none">Volunteer</a>
<a href="faq.html" style="padding: 10px 6px; color: #2B2A28; font-weight: 600; font-size: 17px; text-decoration: none">Questions</a>
<a href="donate.html" style="padding: 10px 6px; color: #2B2A28; font-weight: 600; font-size: 17px; text-decoration: none">Donate</a>
</nav>
</header>

<main>
<section style="max-width: 1120px; margin: 0 auto; padding: 48px 24px 56px">
<p style="margin: 0 0 12px; font-size: 14px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #A8481F">Partners</p>
<h1 style="margin: 0 0 20px; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: clamp(38px, 5.5vw, 58px); line-height: 1.1; color: #1F5C5A">For referral partners</h1>
<p style="margin: 0 0 32px; max-width: 34em; font-size: 21px; line-height: 1.5; color: #3B3935">Case managers, courts, VA offices, hospitals and other agencies can refer people to Firm Ground Homes directly. This page shows our current openings, who we can house, and how fast we respond.</p>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px 28px">
<a class="btn btn-clay" href="#referral-form" style="display: inline-flex; align-items: center; justify-content: center; min-height: 56px; min-width: 230px; padding: 0 32px; border-radius: 999px; background: #A8481F; color: #FFFFFF; font-size: 18px; font-weight: 700; text-decoration: none; border: 2px solid #A8481F; box-sizing: border-box">Send a referral</a>
<p style="margin: 0; max-width: 24em; font-size: 16px; line-height: 1.5; color: #3B3935">Prefer to talk first? Call the referral line at (555) 010-0142, weekdays, 9 am to 5 pm. (Sample number and hours.)</p>
</div>
</section>

<section style="background: #F4EAD6; padding: 72px 24px">
<div style="max-width: 1120px; margin: 0 auto">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; margin-bottom: 36px">
<h2 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: clamp(30px, 4vw, 40px); line-height: 1.15; color: #1F5C5A">Current openings</h2>
<span style="display: inline-block; padding: 2px 12px; border: 1.5px solid #1F5C5A; border-radius: 999px; font-size: 14px; font-weight: 700; color: #1F5C5A">Sample data</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 24px">

<div style="flex: 1 1 280px; min-width: 0; background: #FFFDF8; border: 1px solid #E6D9BF; border-radius: 20px; padding: 28px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px">
<h3 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 24px; line-height: 1.2; color: #2B2A28">Home A</h3>
<span style="padding: 4px 14px; border-radius: 999px; background: #1F5C5A; color: #FFFFFF; font-size: 15px; font-weight: 700">Beds open</span>
</div>
<div style="font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 52px; line-height: 1; color: #1F5C5A">2</div>
<p style="margin: 6px 0 12px">beds open</p>
<p style="margin: 0; font-size: 16px; color: #55524C">Shared rooms</p>
</div>

<div style="flex: 1 1 280px; min-width: 0; background: #FFFDF8; border: 1px solid #E6D9BF; border-radius: 20px; padding: 28px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px">
<h3 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 24px; line-height: 1.2; color: #2B2A28">Home B</h3>
<span style="padding: 4px 14px; border-radius: 999px; background: #2B2A28; color: #FBF6EC; font-size: 15px; font-weight: 700">Full</span>
</div>
<div style="font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 52px; line-height: 1; color: #2B2A28">4</div>
<p style="margin: 6px 0 12px">people on the waitlist</p>
<p style="margin: 0; font-size: 16px; color: #55524C">Shared rooms. Waitlist open.</p>
</div>

<div style="flex: 1 1 280px; min-width: 0; background: #FFFDF8; border: 1px solid #E6D9BF; border-radius: 20px; padding: 28px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px">
<h3 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 24px; line-height: 1.2; color: #2B2A28">Home C</h3>
<span style="padding: 4px 14px; border-radius: 999px; background: #1F5C5A; color: #FFFFFF; font-size: 15px; font-weight: 700">Bed open</span>
</div>
<div style="font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 52px; line-height: 1; color: #1F5C5A">1</div>
<p style="margin: 6px 0 12px">bed open</p>
<p style="margin: 0; font-size: 16px; color: #55524C">Shared rooms</p>
</div>

</div>
<p style="margin: 28px 0 0; font-weight: 600">Availability changes often. Call to confirm before you send someone.</p>
</div>
</section>

<section style="max-width: 1120px; margin: 0 auto; padding: 72px 24px">
<p style="margin: 0 0 12px; font-size: 14px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #A8481F">Criteria</p>
<h2 style="margin: 0 0 36px; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: clamp(30px, 4vw, 40px); line-height: 1.15; color: #1F5C5A">Who we can house</h2>
<div style="display: flex; flex-wrap: wrap; gap: 24px">

<div style="flex: 1 1 380px; min-width: 0; background: #FFFDF8; border: 1px solid #E6D9BF; border-top: 6px solid #1F5C5A; border-radius: 20px; padding: 28px 28px 32px">
<h3 style="margin: 0 0 18px; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 24px; line-height: 1.2; color: #1F5C5A">We can usually accept someone who is</h3>
<ul style="margin: 0; padding: 0; list-style: none">
<li style="display: flex; gap: 14px; align-items: flex-start; margin-bottom: 12px">
<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="14" cy="14" r="13" fill="#E3EEEA" stroke="#1F5C5A" stroke-width="2"/><path d="M8 14.5l4 4 8-9" fill="none" stroke="#1F5C5A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
<span>18 or older</span>
</li>
<li style="display: flex; gap: 14px; align-items: flex-start; margin-bottom: 12px">
<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="14" cy="14" r="13" fill="#E3EEEA" stroke="#1F5C5A" stroke-width="2"/><path d="M8 14.5l4 4 8-9" fill="none" stroke="#1F5C5A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
<span>Working, or actively looking for work</span>
</li>
<li style="display: flex; gap: 14px; align-items: flex-start; margin-bottom: 12px">
<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="14" cy="14" r="13" fill="#E3EEEA" stroke="#1F5C5A" stroke-width="2"/><path d="M8 14.5l4 4 8-9" fill="none" stroke="#1F5C5A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
<span>Ready to live in a shared room in a shared home with house rules</span>
</li>
<li style="display: flex; gap: 14px; align-items: flex-start; margin-bottom: 12px">
<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="14" cy="14" r="13" fill="#E3EEEA" stroke="#1F5C5A" stroke-width="2"/><path d="M8 14.5l4 4 8-9" fill="none" stroke="#1F5C5A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
<span>Willing to complete a background review, done case by case</span>
</li>
<li style="display: flex; gap: 14px; align-items: flex-start">
<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="14" cy="14" r="13" fill="#E3EEEA" stroke="#1F5C5A" stroke-width="2"/><path d="M8 14.5l4 4 8-9" fill="none" stroke="#1F5C5A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
<span>Able to pay the weekly rate, $125 to $175 on a sliding scale</span>
</li>
</ul>
</div>

<div style="flex: 1 1 380px; min-width: 0; background: #FFFDF8; border: 1px solid #E6D9BF; border-top: 6px solid #2B2A28; border-radius: 20px; padding: 28px 28px 32px">
<h3 style="margin: 0 0 14px; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 24px; line-height: 1.2; color: #2B2A28">What we are not</h3>
<ul style="margin: 0 0 18px; padding-left: 22px">
<li style="margin-bottom: 8px">A medical or clinical facility</li>
<li style="margin-bottom: 8px">An emergency shelter</li>
<li>A private apartment</li>
</ul>
<p style="margin: 0; font-weight: 600">If the person needs urgent help, call or text 988, or dial 211.</p>
</div>

</div>
<p style="margin: 28px 0 0; padding: 14px 18px; max-width: 46em; border: 1.5px dashed #8F8575; border-radius: 12px; font-size: 16px; line-height: 1.5; color: #3B3935"><strong>Concept note:</strong> <em>Client to confirm referral criteria, response times and how referral information is handled, with their board or counsel.</em></p>
</section>

<section style="background: #F4EAD6; padding: 72px 24px">
<div style="max-width: 1120px; margin: 0 auto">
<p style="margin: 0 0 12px; font-size: 14px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #A8481F">Three steps</p>
<h2 style="margin: 0 0 36px; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: clamp(30px, 4vw, 40px); line-height: 1.15; color: #1F5C5A">How a referral works</h2>
<div style="display: flex; flex-wrap: wrap; gap: 24px">

<div style="flex: 1 1 280px; min-width: 0; background: #FFFDF8; border: 1px solid #E6D9BF; border-radius: 20px; padding: 28px">
<div style="width: 44px; height: 44px; border-radius: 50%; background: #1F5C5A; color: #FBF6EC; display: flex; align-items: center; justify-content: center; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 22px; margin-bottom: 16px">1</div>
<h3 style="margin: 0 0 8px; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 24px; line-height: 1.2; color: #2B2A28">Send the referral</h3>
<p style="margin: 0 0 16px">Fill out the short form below. The person must know about the referral and agree to be contacted.</p>
<span style="display: inline-block; padding: 4px 14px; border-radius: 999px; background: #E3EEEA; color: #1F5C5A; font-size: 15px; font-weight: 700">Takes about 5 minutes</span>
</div>

<div style="flex: 1 1 280px; min-width: 0; background: #FFFDF8; border: 1px solid #E6D9BF; border-radius: 20px; padding: 28px">
<div style="width: 44px; height: 44px; border-radius: 50%; background: #1F5C5A; color: #FBF6EC; display: flex; align-items: center; justify-content: center; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 22px; margin-bottom: 16px">2</div>
<h3 style="margin: 0 0 8px; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 24px; line-height: 1.2; color: #2B2A28">We confirm with you</h3>
<p style="margin: 0 0 16px">We reply to let you know we received it.</p>
<span style="display: inline-block; padding: 4px 14px; border-radius: 999px; background: #E3EEEA; color: #1F5C5A; font-size: 15px; font-weight: 700">Within 1 business day</span>
</div>

<div style="flex: 1 1 280px; min-width: 0; background: #FFFDF8; border: 1px solid #E6D9BF; border-radius: 20px; padding: 28px">
<div style="width: 44px; height: 44px; border-radius: 50%; background: #1F5C5A; color: #FBF6EC; display: flex; align-items: center; justify-content: center; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 22px; margin-bottom: 16px">3</div>
<h3 style="margin: 0 0 8px; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 24px; line-height: 1.2; color: #2B2A28">We reach out to the person</h3>
<p style="margin: 0 0 16px">We call them directly. They follow the same steps as any applicant, and we give a decision within 5 business days.</p>
<span style="display: inline-block; padding: 4px 14px; border-radius: 999px; background: #E3EEEA; color: #1F5C5A; font-size: 15px; font-weight: 700">Within 3 business days</span>
</div>

</div>
<p style="margin: 20px 0 0; font-size: 14px; color: #55524C">Sample response times.</p>
</div>
</section>

<section id="referral-form" style="max-width: 1120px; margin: 0 auto; padding: 72px 24px">
<div style="max-width: 760px; margin: 0 auto; background: #FFFDF8; border: 1px solid #E6D9BF; border-top: 6px solid #1F5C5A; border-radius: 20px; padding: 32px">
<h2 style="margin: 0 0 8px; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: clamp(28px, 3.5vw, 34px); line-height: 1.2; color: #1F5C5A">Referral form</h2>
<p style="margin: 0 0 24px; color: #3B3935">Short on purpose. We talk with the person directly, so please leave out medical details and case history.</p>

<sc-if value="{{ showConfirm }}" hint-placeholder-val="{{ false }}">
<div role="status" style="background: #E3EEEA; border: 2px solid #1F5C5A; border-radius: 16px; padding: 28px">
<svg width="40" height="40" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="13" fill="#1F5C5A"/><path d="M8 14.5l4 4 8-9" fill="none" stroke="#FBF6EC" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
<p style="margin: 12px 0 20px; font-size: 20px; line-height: 1.5">Thank you, {{ confirmName }}. We received your referral for {{ confirmPerson }}. Expect a reply from us within 1 business day. (Sample.)</p>
<button type="button" onClick="{{ reset }}" style="min-height: 44px; padding: 0 20px; border-radius: 999px; border: 2px solid #1F5C5A; background: transparent; color: #1F5C5A; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer">Reset the sample form</button>
</div>
</sc-if>

<sc-if value="{{ showForm }}" hint-placeholder-val="{{ true }}">
<form onSubmit="{{ submit }}">

<h3 style="margin: 0 0 16px; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 22px; line-height: 1.2; color: #2B2A28">About you</h3>

<div style="margin-bottom: 22px">
<label for="your-name" style="display: block; margin-bottom: 6px; font-weight: 700">Your name <span style="font-weight: 400; color: #55524C">(required)</span></label>
<input id="your-name" type="text" autocomplete="name" value="{{ yourName }}" onChange="{{ onYourName }}" aria-invalid="{{ yourNameError }}" style="display: block; width: 100%; box-sizing: border-box; min-height: 52px; padding: 0 16px; border: 2px solid {{ yourNameBorder }}; border-radius: 12px; background: #FFFFFF; color: #2B2A28; font-family: inherit; font-size: 18px">
<sc-if value="{{ yourNameError }}" hint-placeholder-val="{{ false }}">
<p role="alert" style="margin: 8px 0 0; color: #8C3A15; font-size: 16px; font-weight: 700">Please add your name.</p>
</sc-if>
</div>

<div style="margin-bottom: 22px">
<label for="agency" style="display: block; margin-bottom: 6px; font-weight: 700">Agency or organization <span style="font-weight: 400; color: #55524C">(required)</span></label>
<input id="agency" type="text" autocomplete="organization" value="{{ agency }}" onChange="{{ onAgency }}" aria-invalid="{{ agencyError }}" style="display: block; width: 100%; box-sizing: border-box; min-height: 52px; padding: 0 16px; border: 2px solid {{ agencyBorder }}; border-radius: 12px; background: #FFFFFF; color: #2B2A28; font-family: inherit; font-size: 18px">
<sc-if value="{{ agencyError }}" hint-placeholder-val="{{ false }}">
<p role="alert" style="margin: 8px 0 0; color: #8C3A15; font-size: 16px; font-weight: 700">Please add your agency or organization.</p>
</sc-if>
</div>

<div style="margin-bottom: 22px">
<label for="your-email" style="display: block; margin-bottom: 6px; font-weight: 700">Your email <span style="font-weight: 400; color: #55524C">(required)</span></label>
<input id="your-email" type="text" inputmode="email" autocomplete="email" value="{{ email }}" onChange="{{ onEmail }}" aria-invalid="{{ emailError }}" style="display: block; width: 100%; box-sizing: border-box; min-height: 52px; padding: 0 16px; border: 2px solid {{ emailBorder }}; border-radius: 12px; background: #FFFFFF; color: #2B2A28; font-family: inherit; font-size: 18px">
<sc-if value="{{ emailError }}" hint-placeholder-val="{{ false }}">
<p role="alert" style="margin: 8px 0 0; color: #8C3A15; font-size: 16px; font-weight: 700">Please add an email so we can reply to you.</p>
</sc-if>
</div>

<div style="margin-bottom: 32px">
<label for="your-phone" style="display: block; margin-bottom: 6px; font-weight: 700">Your phone <span style="font-weight: 400; color: #55524C">(optional)</span></label>
<input id="your-phone" type="tel" autocomplete="tel" value="{{ phone }}" onChange="{{ onPhone }}" style="display: block; width: 100%; box-sizing: border-box; min-height: 52px; padding: 0 16px; border: 2px solid #8F8575; border-radius: 12px; background: #FFFFFF; color: #2B2A28; font-family: inherit; font-size: 18px">
</div>

<h3 style="margin: 0 0 16px; padding-top: 24px; border-top: 1px solid #E6D9BF; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 22px; line-height: 1.2; color: #2B2A28">About the person you are referring</h3>

<div style="margin-bottom: 22px">
<label for="person-name" style="display: block; margin-bottom: 6px; font-weight: 700">Their first name <span style="font-weight: 400; color: #55524C">(required)</span></label>
<input id="person-name" type="text" value="{{ personName }}" onChange="{{ onPersonName }}" aria-invalid="{{ personNameError }}" style="display: block; width: 100%; box-sizing: border-box; min-height: 52px; padding: 0 16px; border: 2px solid {{ personNameBorder }}; border-radius: 12px; background: #FFFFFF; color: #2B2A28; font-family: inherit; font-size: 18px">
<sc-if value="{{ personNameError }}" hint-placeholder-val="{{ false }}">
<p role="alert" style="margin: 8px 0 0; color: #8C3A15; font-size: 16px; font-weight: 700">Please add the person's first name.</p>
</sc-if>
</div>

<div style="margin-bottom: 22px">
<label for="person-phone" style="display: block; margin-bottom: 6px; font-weight: 700">Their phone number <span style="font-weight: 400; color: #55524C">(required)</span></label>
<input id="person-phone" type="tel" value="{{ personPhone }}" onChange="{{ onPersonPhone }}" aria-invalid="{{ personPhoneError }}" style="display: block; width: 100%; box-sizing: border-box; min-height: 52px; padding: 0 16px; border: 2px solid {{ personPhoneBorder }}; border-radius: 12px; background: #FFFFFF; color: #2B2A28; font-family: inherit; font-size: 18px">
<sc-if value="{{ personPhoneError }}" hint-placeholder-val="{{ false }}">
<p role="alert" style="margin: 8px 0 0; color: #8C3A15; font-size: 16px; font-weight: 700">Please add a phone number so we can reach them.</p>
</sc-if>
</div>

<div style="margin-bottom: 22px">
<label for="note" style="display: block; margin-bottom: 6px; font-weight: 700">Anything we should know <span style="font-weight: 400; color: #55524C">(optional)</span></label>
<textarea id="note" rows="4" value="{{ note }}" onChange="{{ onNote }}" style="display: block; width: 100%; box-sizing: border-box; padding: 12px 16px; border: 2px solid #8F8575; border-radius: 12px; background: #FFFFFF; color: #2B2A28; font-family: inherit; font-size: 18px; line-height: 1.5; resize: vertical"></textarea>
</div>

<div style="margin-bottom: 22px">
<div style="display: flex; gap: 14px; align-items: flex-start">
<input id="consent" type="checkbox" checked="{{ consent }}" onChange="{{ onConsent }}" aria-invalid="{{ consentError }}" style="flex: none; width: 28px; height: 28px; margin: 2px 0 0; accent-color: #1F5C5A">
<label for="consent" style="font-weight: 600">The person knows about this referral and agrees to be contacted <span style="font-weight: 400; color: #55524C">(required)</span></label>
</div>
<sc-if value="{{ consentError }}" hint-placeholder-val="{{ false }}">
<p role="alert" style="margin: 8px 0 0; color: #8C3A15; font-size: 16px; font-weight: 700">Please confirm the person agreed to be contacted.</p>
</sc-if>
</div>

<p style="margin: 0 0 24px; padding: 14px 18px; background: #F4EAD6; border-radius: 12px; font-size: 16px; line-height: 1.5">Only share what the person has agreed to. We never share their information.</p>

<button type="submit" style="display: inline-flex; align-items: center; justify-content: center; min-height: 56px; min-width: 230px; padding: 0 32px; border-radius: 999px; border: 2px solid #A8481F; background: #A8481F; color: #FFFFFF; font-family: inherit; font-size: 18px; font-weight: 700; cursor: pointer">Send referral</button>
<p style="margin: 14px 0 0; font-size: 14px; line-height: 1.5; color: #55524C">Concept site: nothing typed here is sent or saved.</p>
</form>
</sc-if>
</div>
</section>
</main>

<footer style="background: #2B2A28; color: #F3EAD8; padding: 56px 24px 40px">
<div style="max-width: 1120px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 32px 56px">
<div style="flex: 1 1 260px; min-width: 0">
<div style="font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 24px; color: #FBF6EC; margin-bottom: 8px">Firm Ground Homes</div>
<p style="margin: 0; font-size: 16px; line-height: 1.5">Steady ground while you rebuild.</p>
</div>
<div style="flex: 1 1 260px; min-width: 0">
<h2 style="margin: 0 0 8px; font-size: 16px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #F4C46B">Need help right now?</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.5">Call or text 988, or dial 211 for local services.</p>
</div>
<div style="flex: 1 1 260px; min-width: 0">
<h2 style="margin: 0 0 8px; font-size: 16px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #F4C46B">Accessibility</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.5">We build this site to meet WCAG 2.1 AA. If something is hard to use, tell us and we will fix it.</p>
</div>
</div>
<p style="max-width: 1120px; margin: 40px auto 0; padding-top: 20px; border-top: 1px solid #55524C; font-size: 14px; line-height: 1.5; color: #D9CFBB">Concept site. Firm Ground Homes is a fictional organization. All numbers, quotes and images are samples or placeholders.</p>
</footer>

</div>
</template>
<div id="app"></div>
<script src="assets/dc-lite.js"></script>
<script>
class Component extends DCLogic {
state = { yourName: '', agency: '', email: '', phone: '', personName: '', personPhone: '', note: '', consent: false, tried: false, done: false, doneName: '', donePerson: '' };

errors(c) {
return {
yourName: !c.yourName.trim(),
agency: !c.agency.trim(),
email: !/^\S+@\S+\.\S+$/.test(c.email.trim()),
personName: !c.personName.trim(),
personPhone: c.personPhone.replace(/\D/g, '').length < 7,
consent: !c.consent
};
}

renderVals() {
const s = this.state;
const er = this.errors(s);
const t = s.tried;
const ok = '#8F8575';
const bad = '#A8481F';
const on = (k) => (e) => this.setState({ [k]: e.target.value });
return {
yourName: s.yourName,
agency: s.agency,
email: s.email,
phone: s.phone,
personName: s.personName,
personPhone: s.personPhone,
note: s.note,
consent: s.consent,
yourNameError: t && er.yourName,
agencyError: t && er.agency,
emailError: t && er.email,
personNameError: t && er.personName,
personPhoneError: t && er.personPhone,
consentError: t && er.consent,
yourNameBorder: t && er.yourName ? bad : ok,
agencyBorder: t && er.agency ? bad : ok,
emailBorder: t && er.email ? bad : ok,
personNameBorder: t && er.personName ? bad : ok,
personPhoneBorder: t && er.personPhone ? bad : ok,
showForm: !s.done,
showConfirm: s.done,
confirmName: s.doneName,
confirmPerson: s.donePerson,
onYourName: on('yourName'),
onAgency: on('agency'),
onEmail: on('email'),
onPhone: on('phone'),
onPersonName: on('personName'),
onPersonPhone: on('personPhone'),
onNote: on('note'),
onConsent: (e) => this.setState({ consent: e.target.checked }),
submit: (e) => {
if (e && e.preventDefault) e.preventDefault();
const c = this.state;
const errs = this.errors(c);
const valid = !Object.values(errs).some(Boolean);
if (valid) {
this.setState({ tried: true, done: true, doneName: c.yourName.trim(), donePerson: c.personName.trim() });
} else {
this.setState({ tried: true });
}
},
reset: () => this.setState({ yourName: '', agency: '', email: '', phone: '', personName: '', personPhone: '', note: '', consent: false, tried: false, done: false, doneName: '', donePerson: '' })
};
}
}
DC.mount(Component);
</script>
<noscript><p style="padding:24px">This sample form needs JavaScript.</p></noscript>
