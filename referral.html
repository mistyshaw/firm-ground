<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Firm Ground Homes: For Referral Partners</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&amp;family=Source+Sans+3:wght@400;600;700&amp;display=swap">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<template id="dc-tpl">

<div class="site">

<div class="concept-banner"><strong>Concept site.</strong> Firm Ground Homes is a fictional organization created as a design sample.</div>

<header class="site-header">
<a href="index.html" class="site-logo">
<svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="10" fill="#1F5C5A"/><path d="M9 18 L18 10 L27 18 M12 17v9h12v-9" fill="none" stroke="#FBF6EC" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
<span class="site-logo__name">Firm Ground Homes</span>
</a>
<nav aria-label="Main" class="site-nav">
<a href="about.html" class="site-nav__link">About</a>
<a href="programs.html" class="site-nav__link">Programs</a>
<a href="apply.html" class="site-nav__link">How to apply</a>
<a href="referral.html" aria-current="page" class="site-nav__link site-nav__link--current">For referral partners</a>
<a href="volunteer.html" class="site-nav__link">Volunteer</a>
<a href="faq.html" class="site-nav__link">Questions</a>
<a href="donate.html" class="site-nav__link">Donate</a>
</nav>
</header>

<main>
<section class="page-hero">
<p class="eyebrow">Partners</p>
<h1 class="page-title">For referral partners</h1>
<p class="page-lead">Case managers, courts, VA offices, hospitals and other agencies can refer people to Firm Ground Homes directly. This page shows our current openings, who we can house, and how fast we respond.</p>
<div class="referral-hero__actions">
<a href="#referral-form" class="button button--primary button--wide">Send a referral</a>
<p class="referral-hero__phone-hint">Prefer to talk first? Call the referral line at (555) 010-0142, weekdays, 9 am to 5 pm. (Sample number and hours.)</p>
</div>
</section>

<section class="band-section">
<div class="container">
<div class="section-heading-row--roomy">
<h2 class="split-layout__title">Current openings</h2>
<span class="sample-badge">Sample data</span>
</div>
<div class="card-grid">

<div class="step-card">
<div class="bed-status-card__header">
<h3 class="bed-status-card__title">Home A</h3>
<span class="status-badge status-badge--open">Beds open</span>
</div>
<div class="bed-status-card__count">2</div>
<p class="bed-status-card__count-label">beds open</p>
<p class="bed-status-card__detail">Shared rooms</p>
</div>

<div class="step-card">
<div class="bed-status-card__header">
<h3 class="bed-status-card__title">Home B</h3>
<span class="status-badge status-badge--full">Full</span>
</div>
<div class="bed-status-card__count--full">4</div>
<p class="bed-status-card__count-label">people on the waitlist</p>
<p class="bed-status-card__detail">Shared rooms. Waitlist open.</p>
</div>

<div class="step-card">
<div class="bed-status-card__header">
<h3 class="bed-status-card__title">Home C</h3>
<span class="status-badge status-badge--open">Bed open</span>
</div>
<div class="bed-status-card__count">1</div>
<p class="bed-status-card__count-label">bed open</p>
<p class="bed-status-card__detail">Shared rooms</p>
</div>

</div>
<p class="steps-footnote">Availability changes often. Call to confirm before you send someone.</p>
</div>
</section>

<section class="page-section">
<p class="eyebrow">Criteria</p>
<h2 class="section-title">Who we can house</h2>
<div class="card-grid">

<div class="eligibility-card">
<h3 class="eligibility-card__title">We can usually accept someone who is</h3>
<ul class="plain-list">
<li class="checklist__item--spaced">
<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true" class="icon--check"><circle cx="14" cy="14" r="13" fill="#E3EEEA" stroke="#1F5C5A" stroke-width="2"/><path d="M8 14.5l4 4 8-9" fill="none" stroke="#1F5C5A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
<span>18 or older</span>
</li>
<li class="checklist__item--spaced">
<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true" class="icon--check"><circle cx="14" cy="14" r="13" fill="#E3EEEA" stroke="#1F5C5A" stroke-width="2"/><path d="M8 14.5l4 4 8-9" fill="none" stroke="#1F5C5A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
<span>Working, or actively looking for work</span>
</li>
<li class="checklist__item--spaced">
<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true" class="icon--check"><circle cx="14" cy="14" r="13" fill="#E3EEEA" stroke="#1F5C5A" stroke-width="2"/><path d="M8 14.5l4 4 8-9" fill="none" stroke="#1F5C5A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
<span>Ready to live in a shared room in a shared home with house rules</span>
</li>
<li class="checklist__item--spaced">
<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true" class="icon--check"><circle cx="14" cy="14" r="13" fill="#E3EEEA" stroke="#1F5C5A" stroke-width="2"/><path d="M8 14.5l4 4 8-9" fill="none" stroke="#1F5C5A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
<span>Willing to complete a background review, done case by case</span>
</li>
<li class="checklist__item--flush">
<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true" class="icon--check"><circle cx="14" cy="14" r="13" fill="#E3EEEA" stroke="#1F5C5A" stroke-width="2"/><path d="M8 14.5l4 4 8-9" fill="none" stroke="#1F5C5A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
<span>Able to pay the weekly rate, $125 to $175 on a sliding scale</span>
</li>
</ul>
</div>

<div class="exclusions-card">
<h3 class="criteria-card__title criteria-card__title--screening">What we are not</h3>
<ul class="exclusions-list">
<li class="criteria-card__item">A medical or clinical facility</li>
<li class="criteria-card__item">An emergency shelter</li>
<li>A private apartment</li>
</ul>
<p class="emphasis-text">If the person needs urgent help, call or text 988, or dial 211.</p>
</div>

</div>
<p class="concept-note--wide"><strong>Concept note:</strong> <em>Client to confirm referral criteria, response times and how referral information is handled, with their board or counsel.</em></p>
</section>

<section class="band-section">
<div class="container">
<p class="eyebrow">Three steps</p>
<h2 class="section-title">How a referral works</h2>
<div class="card-grid">

<div class="step-card">
<div class="step-number">1</div>
<h3 class="card-heading">Send the referral</h3>
<p class="card-intro">Fill out the short form below. The person must know about the referral and agree to be contacted.</p>
<span class="time-badge">Takes about 5 minutes</span>
</div>

<div class="step-card">
<div class="step-number">2</div>
<h3 class="card-heading">We confirm with you</h3>
<p class="card-intro">We reply to let you know we received it.</p>
<span class="time-badge">Within 1 business day</span>
</div>

<div class="step-card">
<div class="step-number">3</div>
<h3 class="card-heading">We reach out to the person</h3>
<p class="card-intro">We call them directly. They follow the same steps as any applicant, and we give a decision within 5 business days.</p>
<span class="time-badge">Within 3 business days</span>
</div>

</div>
<p class="sample-note">Sample response times.</p>
</div>
</section>

<section id="referral-form" class="page-section">
<div class="sample-form-card">
<h2 class="form-card__title">Referral form</h2>
<p class="form-card__intro">Short on purpose. We talk with the person directly, so please leave out medical details and case history.</p>

<sc-if value="{{ showConfirm }}" hint-placeholder-val="{{ false }}">
<div role="status" class="confirmation-panel">
<svg width="40" height="40" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="13" fill="#1F5C5A"/><path d="M8 14.5l4 4 8-9" fill="none" stroke="#FBF6EC" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
<p class="confirmation-panel__message">Thank you, {{ confirmName }}. We received your referral for {{ confirmPerson }}. Expect a reply from us within 1 business day. (Sample.)</p>
<button type="button" onClick="{{ reset }}" class="button button--outline button--small">Reset the sample form</button>
</div>
</sc-if>

<sc-if value="{{ showForm }}" hint-placeholder-val="{{ true }}">
<form onSubmit="{{ submit }}">

<h3 class="form-section-title">About you</h3>

<div class="form-field">
<label for="your-name" class="form-field__label">Your name <span class="form-field__hint">(required)</span></label>
<input id="your-name" type="text" autocomplete="name" value="{{ yourName }}" onChange="{{ onYourName }}" aria-invalid="{{ yourNameError }}" class="text-input {{ yourNameBorder }}">
<sc-if value="{{ yourNameError }}" hint-placeholder-val="{{ false }}">
<p role="alert" class="form-field__error">Please add your name.</p>
</sc-if>
</div>

<div class="form-field">
<label for="agency" class="form-field__label">Agency or organization <span class="form-field__hint">(required)</span></label>
<input id="agency" type="text" autocomplete="organization" value="{{ agency }}" onChange="{{ onAgency }}" aria-invalid="{{ agencyError }}" class="text-input {{ agencyBorder }}">
<sc-if value="{{ agencyError }}" hint-placeholder-val="{{ false }}">
<p role="alert" class="form-field__error">Please add your agency or organization.</p>
</sc-if>
</div>

<div class="form-field">
<label for="your-email" class="form-field__label">Your email <span class="form-field__hint">(required)</span></label>
<input id="your-email" type="text" inputmode="email" autocomplete="email" value="{{ email }}" onChange="{{ onEmail }}" aria-invalid="{{ emailError }}" class="text-input {{ emailBorder }}">
<sc-if value="{{ emailError }}" hint-placeholder-val="{{ false }}">
<p role="alert" class="form-field__error">Please add an email so we can reply to you.</p>
</sc-if>
</div>

<div class="form-field--section-end">
<label for="your-phone" class="form-field__label">Your phone <span class="form-field__hint">(optional)</span></label>
<input id="your-phone" type="tel" autocomplete="tel" value="{{ phone }}" onChange="{{ onPhone }}" class="text-input">
</div>

<h3 class="form-section-title--divided">About the person you are referring</h3>

<div class="form-field">
<label for="person-name" class="form-field__label">Their first name <span class="form-field__hint">(required)</span></label>
<input id="person-name" type="text" value="{{ personName }}" onChange="{{ onPersonName }}" aria-invalid="{{ personNameError }}" class="text-input {{ personNameBorder }}">
<sc-if value="{{ personNameError }}" hint-placeholder-val="{{ false }}">
<p role="alert" class="form-field__error">Please add the person's first name.</p>
</sc-if>
</div>

<div class="form-field">
<label for="person-phone" class="form-field__label">Their phone number <span class="form-field__hint">(required)</span></label>
<input id="person-phone" type="tel" value="{{ personPhone }}" onChange="{{ onPersonPhone }}" aria-invalid="{{ personPhoneError }}" class="text-input {{ personPhoneBorder }}">
<sc-if value="{{ personPhoneError }}" hint-placeholder-val="{{ false }}">
<p role="alert" class="form-field__error">Please add a phone number so we can reach them.</p>
</sc-if>
</div>

<div class="form-field">
<label for="note" class="form-field__label">Anything we should know <span class="form-field__hint">(optional)</span></label>
<textarea id="note" rows="4" value="{{ note }}" onChange="{{ onNote }}" class="textarea-input"></textarea>
</div>

<div class="form-field">
<div class="checklist__item--flush">
<input id="consent" type="checkbox" checked="{{ consent }}" onChange="{{ onConsent }}" aria-invalid="{{ consentError }}" class="consent-checkbox">
<label for="consent" class="consent-label">The person knows about this referral and agrees to be contacted <span class="form-field__hint">(required)</span></label>
</div>
<sc-if value="{{ consentError }}" hint-placeholder-val="{{ false }}">
<p role="alert" class="form-field__error">Please confirm the person agreed to be contacted.</p>
</sc-if>
</div>

<p class="form-info-note">Only share what the person has agreed to. We never share their information.</p>

<button type="submit" class="button button--primary button--wide">Send referral</button>
<p class="form-footnote">Concept site: nothing typed here is sent or saved.</p>
</form>
</sc-if>
</div>
</section>
</main>

<footer class="site-footer">
<div class="site-footer__inner">
<div class="site-footer__column">
<div class="site-footer__brand">Firm Ground Homes</div>
<p class="site-footer__text">Steady ground while you rebuild.</p>
</div>
<div class="site-footer__column">
<h2 class="site-footer__heading">Need help right now?</h2>
<p class="site-footer__text">Call or text 988, or dial 211 for local services.</p>
</div>
<div class="site-footer__column">
<h2 class="site-footer__heading">Accessibility</h2>
<p class="site-footer__text">We build this site to meet WCAG 2.1 AA. If something is hard to use, tell us and we will fix it.</p>
</div>
</div>
<p class="site-footer__disclaimer">Concept site. Firm Ground Homes is a fictional organization. All numbers, quotes and images are samples or placeholders.</p>
</footer>

</div>
</template>
<div id="app"></div>
<script src="assets/dc-lite.js"></script>
<script>
class Component extends DCLogic {
state = { yourName: '', agency: '', email: '', phone: '', personName: '', personPhone: '', note: '', consent: false, tried: false, done: false, doneName: '', donePerson: '' };

errors(c) {
return {
yourName: !c.yourName.trim(),
agency: !c.agency.trim(),
email: !/^\S+@\S+\.\S+$/.test(c.email.trim()),
personName: !c.personName.trim(),
personPhone: c.personPhone.replace(/\D/g, '').length < 7,
consent: !c.consent
};
}

renderVals() {
const s = this.state;
const er = this.errors(s);
const t = s.tried;
const ok = '#8F8575';
const bad = '#A8481F';
const on = (k) => (e) => this.setState({ [k]: e.target.value });
return {
yourName: s.yourName,
agency: s.agency,
email: s.email,
phone: s.phone,
personName: s.personName,
personPhone: s.personPhone,
note: s.note,
consent: s.consent,
yourNameError: t && er.yourName,
agencyError: t && er.agency,
emailError: t && er.email,
personNameError: t && er.personName,
personPhoneError: t && er.personPhone,
consentError: t && er.consent,
yourNameBorder: t && er.yourName ? 'is-invalid' : '',
agencyBorder: t && er.agency ? 'is-invalid' : '',
emailBorder: t && er.email ? 'is-invalid' : '',
personNameBorder: t && er.personName ? 'is-invalid' : '',
personPhoneBorder: t && er.personPhone ? 'is-invalid' : '',
showForm: !s.done,
showConfirm: s.done,
confirmName: s.doneName,
confirmPerson: s.donePerson,
onYourName: on('yourName'),
onAgency: on('agency'),
onEmail: on('email'),
onPhone: on('phone'),
onPersonName: on('personName'),
onPersonPhone: on('personPhone'),
onNote: on('note'),
onConsent: (e) => this.setState({ consent: e.target.checked }),
submit: (e) => {
if (e && e.preventDefault) e.preventDefault();
const c = this.state;
const errs = this.errors(c);
const valid = !Object.values(errs).some(Boolean);
if (valid) {
this.setState({ tried: true, done: true, doneName: c.yourName.trim(), donePerson: c.personName.trim() });
} else {
this.setState({ tried: true });
}
},
reset: () => this.setState({ yourName: '', agency: '', email: '', phone: '', personName: '', personPhone: '', note: '', consent: false, tried: false, done: false, doneName: '', donePerson: '' })
};
}
}
DC.mount(Component);
</script>
<noscript><p class="noscript-message">This sample form needs JavaScript.</p></noscript>
</body>
</html>
