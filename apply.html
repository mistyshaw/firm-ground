<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Firm Ground Homes: How to Apply</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&amp;family=Source+Sans+3:wght@400;600;700&amp;display=swap">
<style>
body{margin:0;background:#FBF6EC;color:#2B2A28;font-family:'Source Sans 3',system-ui,sans-serif;font-size:18px;line-height:1.6}
a{color:#1F5C5A}
a:hover{text-decoration:underline}
a:focus-visible{outline:3px solid #A8481F;outline-offset:3px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid #A8481F;outline-offset:2px}
.btn:hover{text-decoration:none}
.btn-clay:hover{background:#8C3A15 !important}
.btn-teal:hover{background:#134240 !important}
.btn-line:hover{background:#E3EEEA !important}
.btn-cream:hover{background:#F3EAD8 !important}
</style>
</head>
<body>
<template id="dc-tpl">

<div style="width: 100%; background: #FBF6EC; color: #2B2A28; font-family: 'Source Sans 3', system-ui, sans-serif; font-size: 18px; line-height: 1.6">

<div style="background: #2B2A28; color: #FBF6EC; font-size: 15px; line-height: 1.4; padding: 10px 24px; text-align: center"><strong>Concept site.</strong> Firm Ground Homes is a fictional organization created as a design sample.</div>

<header style="max-width: 1120px; margin: 0 auto; padding: 20px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 32px">
<a href="index.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #1F5C5A">
<svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="10" fill="#1F5C5A"/><path d="M9 18 L18 10 L27 18 M12 17v9h12v-9" fill="none" stroke="#FBF6EC" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
<span style="font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 24px; line-height: 1.1">Firm Ground Homes</span>
</a>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 20px">
<a href="about.html" style="padding: 10px 6px; color: #2B2A28; font-weight: 600; font-size: 17px; text-decoration: none">About</a>
<a href="programs.html" style="padding: 10px 6px; color: #2B2A28; font-weight: 600; font-size: 17px; text-decoration: none">Programs</a>
<a href="apply.html" aria-current="page" style="padding: 10px 6px; color: #1F5C5A; font-weight: 700; font-size: 17px; text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 8px; text-decoration-color: #A8481F">How to apply</a>
<a href="referral.html" style="padding: 10px 6px; color: #2B2A28; font-weight: 600; font-size: 17px; text-decoration: none">For referral partners</a>
<a href="volunteer.html" style="padding: 10px 6px; color: #2B2A28; font-weight: 600; font-size: 17px; text-decoration: none">Volunteer</a>
<a href="faq.html" style="padding: 10px 6px; color: #2B2A28; font-weight: 600; font-size: 17px; text-decoration: none">Questions</a>
<a href="donate.html" style="padding: 10px 6px; color: #2B2A28; font-weight: 600; font-size: 17px; text-decoration: none">Donate</a>
</nav>
</header>

<main>
<section style="max-width: 1120px; margin: 0 auto; padding: 48px 24px 56px">
<p style="margin: 0 0 12px; font-size: 14px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #A8481F">Apply</p>
<h1 style="margin: 0 0 20px; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: clamp(38px, 5.5vw, 58px); line-height: 1.1; color: #1F5C5A">How to apply</h1>
<p style="margin: 0 0 32px; max-width: 34em; font-size: 21px; line-height: 1.5; color: #3B3935">Applying takes about 10 minutes. You do not need a perfect story or every document today. Start the form, and we will help with the rest.</p>
<a class="btn btn-clay" href="#form" style="display: inline-flex; align-items: center; justify-content: center; min-height: 56px; min-width: 230px; padding: 0 32px; border-radius: 999px; background: #A8481F; color: #FFFFFF; font-size: 18px; font-weight: 700; text-decoration: none; border: 2px solid #A8481F; box-sizing: border-box">Start the form</a>
</section>

<section style="background: #F4EAD6; padding: 72px 24px">
<div style="max-width: 1120px; margin: 0 auto">
<p style="margin: 0 0 12px; font-size: 14px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #A8481F">The process</p>
<h2 style="margin: 0 0 36px; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: clamp(30px, 4vw, 40px); line-height: 1.15; color: #1F5C5A">Four steps</h2>
<div style="display: flex; flex-wrap: wrap; gap: 24px">
<div style="flex: 1 1 240px; min-width: 0; background: #FFFDF8; border: 1px solid #E6D9BF; border-radius: 20px; padding: 28px">
<div style="width: 44px; height: 44px; border-radius: 50%; background: #1F5C5A; color: #FBF6EC; display: flex; align-items: center; justify-content: center; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 22px; margin-bottom: 16px">1</div>
<h3 style="margin: 0 0 8px; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 24px; line-height: 1.2; color: #2B2A28">Send the short form</h3>
<p style="margin: 0">Tell us how to reach you and a little about your work situation.</p>
</div>
<div style="flex: 1 1 240px; min-width: 0; background: #FFFDF8; border: 1px solid #E6D9BF; border-radius: 20px; padding: 28px">
<div style="width: 44px; height: 44px; border-radius: 50%; background: #1F5C5A; color: #FBF6EC; display: flex; align-items: center; justify-content: center; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 22px; margin-bottom: 16px">2</div>
<h3 style="margin: 0 0 8px; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 24px; line-height: 1.2; color: #2B2A28">We call you</h3>
<p style="margin: 0">A staff member phones within 3 business days to answer questions and talk through screening.</p>
</div>
<div style="flex: 1 1 240px; min-width: 0; background: #FFFDF8; border: 1px solid #E6D9BF; border-radius: 20px; padding: 28px">
<div style="width: 44px; height: 44px; border-radius: 50%; background: #1F5C5A; color: #FBF6EC; display: flex; align-items: center; justify-content: center; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 22px; margin-bottom: 16px">3</div>
<h3 style="margin: 0 0 8px; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 24px; line-height: 1.2; color: #2B2A28">Meet us</h3>
<p style="margin: 0">A short interview and a tour of the home, in person or by video.</p>
</div>
<div style="flex: 1 1 240px; min-width: 0; background: #FFFDF8; border: 1px solid #E6D9BF; border-radius: 20px; padding: 28px">
<div style="width: 44px; height: 44px; border-radius: 50%; background: #1F5C5A; color: #FBF6EC; display: flex; align-items: center; justify-content: center; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 22px; margin-bottom: 16px">4</div>
<h3 style="margin: 0 0 8px; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 24px; line-height: 1.2; color: #2B2A28">Decision and move-in</h3>
<p style="margin: 0">We let you know within 5 business days. If it is a yes, you sign the house agreement, pay the deposit and pick a move-in day.</p>
</div>
</div>
<p style="margin: 28px 0 0; font-weight: 600">If our homes are full, we add you to the waitlist and tell you where you stand.</p>
</div>
</section>

<section style="max-width: 1120px; margin: 0 auto; padding: 72px 24px">
<div style="display: flex; flex-wrap: wrap; gap: 48px; align-items: flex-start">

<div style="flex: 1 1 340px; min-width: 0">
<h2 style="margin: 0 0 20px; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: clamp(28px, 3.5vw, 34px); line-height: 1.2; color: #1F5C5A">What to bring to the interview</h2>
<ul style="margin: 0 0 20px; padding: 0; list-style: none">
<li style="display: flex; gap: 14px; align-items: flex-start; margin-bottom: 14px">
<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="14" cy="14" r="13" fill="#E3EEEA" stroke="#1F5C5A" stroke-width="2"/><path d="M8 14.5l4 4 8-9" fill="none" stroke="#1F5C5A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
<span>Photo ID</span>
</li>
<li style="display: flex; gap: 14px; align-items: flex-start; margin-bottom: 14px">
<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="14" cy="14" r="13" fill="#E3EEEA" stroke="#1F5C5A" stroke-width="2"/><path d="M8 14.5l4 4 8-9" fill="none" stroke="#1F5C5A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
<span>Proof of income, a job offer letter, or a list of your job search steps</span>
</li>
<li style="display: flex; gap: 14px; align-items: flex-start; margin-bottom: 14px">
<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="14" cy="14" r="13" fill="#E3EEEA" stroke="#1F5C5A" stroke-width="2"/><path d="M8 14.5l4 4 8-9" fill="none" stroke="#1F5C5A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
<span>A referral letter, if someone referred you (optional)</span>
</li>
<li style="display: flex; gap: 14px; align-items: flex-start">
<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="14" cy="14" r="13" fill="#E3EEEA" stroke="#1F5C5A" stroke-width="2"/><path d="M8 14.5l4 4 8-9" fill="none" stroke="#1F5C5A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
<span>One emergency contact</span>
</li>
</ul>
<p style="margin: 0; font-weight: 600">Don't have everything? Apply anyway. We will help you gather what is missing.</p>
</div>

<div id="form" style="flex: 1 1 460px; min-width: 0; background: #FFFDF8; border: 1px solid #E6D9BF; border-top: 6px solid #1F5C5A; border-radius: 20px; padding: 32px">
<h2 style="margin: 0 0 8px; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: clamp(28px, 3.5vw, 34px); line-height: 1.2; color: #1F5C5A">Inquiry form</h2>
<p style="margin: 0 0 24px; color: #3B3935">Fewer fields means fewer barriers, so the form stays short.</p>

<sc-if value="{{ showConfirm }}" hint-placeholder-val="{{ false }}">
<div role="status" style="background: #E3EEEA; border: 2px solid #1F5C5A; border-radius: 16px; padding: 28px">
<svg width="40" height="40" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="13" fill="#1F5C5A"/><path d="M8 14.5l4 4 8-9" fill="none" stroke="#FBF6EC" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
<p style="margin: 12px 0 20px; font-size: 20px; line-height: 1.5">Thank you, {{ confirmName }}. We received your application. Expect a call within 3 business days from (555) 010-0142. (Sample number.)</p>
<button type="button" onClick="{{ reset }}" style="min-height: 44px; padding: 0 20px; border-radius: 999px; border: 2px solid #1F5C5A; background: transparent; color: #1F5C5A; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer">Reset the sample form</button>
</div>
</sc-if>

<sc-if value="{{ showForm }}" hint-placeholder-val="{{ true }}">
<form onSubmit="{{ submit }}">

<div style="margin-bottom: 22px">
<label for="first-name" style="display: block; margin-bottom: 6px; font-weight: 700">First name <span style="font-weight: 400; color: #55524C">(required)</span></label>
<input id="first-name" type="text" autocomplete="given-name" value="{{ firstName }}" onChange="{{ onFirstName }}" aria-invalid="{{ nameError }}" style="display: block; width: 100%; box-sizing: border-box; min-height: 52px; padding: 0 16px; border: 2px solid {{ nameBorder }}; border-radius: 12px; background: #FFFFFF; color: #2B2A28; font-family: inherit; font-size: 18px">
<sc-if value="{{ nameError }}" hint-placeholder-val="{{ false }}">
<p role="alert" style="margin: 8px 0 0; color: #8C3A15; font-size: 16px; font-weight: 700">Please add your first name so we know what to call you.</p>
</sc-if>
</div>

<div style="margin-bottom: 22px">
<label for="phone" style="display: block; margin-bottom: 6px; font-weight: 700">Phone number <span style="font-weight: 400; color: #55524C">(required)</span></label>
<input id="phone" type="tel" autocomplete="tel" value="{{ phone }}" onChange="{{ onPhone }}" aria-invalid="{{ phoneError }}" style="display: block; width: 100%; box-sizing: border-box; min-height: 52px; padding: 0 16px; border: 2px solid {{ phoneBorder }}; border-radius: 12px; background: #FFFFFF; color: #2B2A28; font-family: inherit; font-size: 18px">
<sc-if value="{{ phoneError }}" hint-placeholder-val="{{ false }}">
<p role="alert" style="margin: 8px 0 0; color: #8C3A15; font-size: 16px; font-weight: 700">Please add a phone number so we can reach you.</p>
</sc-if>
</div>

<div style="margin-bottom: 22px">
<label for="email" style="display: block; margin-bottom: 6px; font-weight: 700">Email <span style="font-weight: 400; color: #55524C">(optional)</span></label>
<input id="email" type="email" autocomplete="email" value="{{ email }}" onChange="{{ onEmail }}" style="display: block; width: 100%; box-sizing: border-box; min-height: 52px; padding: 0 16px; border: 2px solid #8F8575; border-radius: 12px; background: #FFFFFF; color: #2B2A28; font-family: inherit; font-size: 18px">
</div>

<div style="margin-bottom: 22px">
<label for="call-time" style="display: block; margin-bottom: 6px; font-weight: 700">Best time to call <span style="font-weight: 400; color: #55524C">(optional)</span></label>
<select id="call-time" value="{{ callTime }}" onChange="{{ onCallTime }}" style="display: block; width: 100%; box-sizing: border-box; min-height: 52px; padding: 0 12px; border: 2px solid #8F8575; border-radius: 12px; background: #FFFFFF; color: #2B2A28; font-family: inherit; font-size: 18px">
<option value="">Choose a time</option>
<option value="Morning">Morning</option>
<option value="Afternoon">Afternoon</option>
<option value="Evening">Evening</option>
</select>
</div>

<div style="margin-bottom: 22px">
<label for="work" style="display: block; margin-bottom: 6px; font-weight: 700">Your work situation <span style="font-weight: 400; color: #55524C">(required)</span></label>
<select id="work" value="{{ work }}" onChange="{{ onWork }}" aria-invalid="{{ workError }}" style="display: block; width: 100%; box-sizing: border-box; min-height: 52px; padding: 0 12px; border: 2px solid {{ workBorder }}; border-radius: 12px; background: #FFFFFF; color: #2B2A28; font-family: inherit; font-size: 18px">
<option value="">Choose one</option>
<option value="Working">Working</option>
<option value="Looking for work">Looking for work</option>
<option value="Something else">Something else</option>
</select>
<sc-if value="{{ workError }}" hint-placeholder-val="{{ false }}">
<p role="alert" style="margin: 8px 0 0; color: #8C3A15; font-size: 16px; font-weight: 700">Please choose the option that fits best.</p>
</sc-if>
</div>

<div style="margin-bottom: 22px">
<label for="note" style="display: block; margin-bottom: 6px; font-weight: 700">Anything you want us to know <span style="font-weight: 400; color: #55524C">(optional)</span></label>
<textarea id="note" rows="4" value="{{ note }}" onChange="{{ onNote }}" style="display: block; width: 100%; box-sizing: border-box; padding: 12px 16px; border: 2px solid #8F8575; border-radius: 12px; background: #FFFFFF; color: #2B2A28; font-family: inherit; font-size: 18px; line-height: 1.5; resize: vertical"></textarea>
</div>

<div style="margin-bottom: 22px">
<div style="display: flex; gap: 14px; align-items: flex-start">
<input id="consent" type="checkbox" checked="{{ consent }}" onChange="{{ onConsent }}" aria-invalid="{{ consentError }}" style="flex: none; width: 28px; height: 28px; margin: 2px 0 0; accent-color: #1F5C5A">
<label for="consent" style="font-weight: 600">Permission to contact me by phone, text or email <span style="font-weight: 400; color: #55524C">(required)</span></label>
</div>
<sc-if value="{{ consentError }}" hint-placeholder-val="{{ false }}">
<p role="alert" style="margin: 8px 0 0; color: #8C3A15; font-size: 16px; font-weight: 700">Please check the box so we can contact you.</p>
</sc-if>
</div>

<p style="margin: 0 0 24px; padding: 14px 18px; background: #F4EAD6; border-radius: 12px; font-size: 16px; line-height: 1.5">We do not ask about your background here. We talk about it with you by phone. We never share your information. Share only what you are comfortable putting in writing.</p>

<button type="submit" style="display: inline-flex; align-items: center; justify-content: center; min-height: 56px; min-width: 230px; padding: 0 32px; border-radius: 999px; border: 2px solid #A8481F; background: #A8481F; color: #FFFFFF; font-family: inherit; font-size: 18px; font-weight: 700; cursor: pointer">Send my application</button>
<p style="margin: 14px 0 0; font-size: 14px; line-height: 1.5; color: #55524C">Concept site: nothing typed here is sent or saved.</p>
</form>
</sc-if>
</div>

</div>
</section>
</main>

<footer style="background: #2B2A28; color: #F3EAD8; padding: 56px 24px 40px">
<div style="max-width: 1120px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 32px 56px">
<div style="flex: 1 1 260px; min-width: 0">
<div style="font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 24px; color: #FBF6EC; margin-bottom: 8px">Firm Ground Homes</div>
<p style="margin: 0; font-size: 16px; line-height: 1.5">Steady ground while you rebuild.</p>
</div>
<div style="flex: 1 1 260px; min-width: 0">
<h2 style="margin: 0 0 8px; font-size: 16px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #F4C46B">Need help right now?</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.5">Call or text 988, or dial 211 for local services.</p>
</div>
<div style="flex: 1 1 260px; min-width: 0">
<h2 style="margin: 0 0 8px; font-size: 16px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #F4C46B">Accessibility</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.5">We build this site to meet WCAG 2.1 AA. If something is hard to use, tell us and we will fix it.</p>
</div>
</div>
<p style="max-width: 1120px; margin: 40px auto 0; padding-top: 20px; border-top: 1px solid #55524C; font-size: 14px; line-height: 1.5; color: #D9CFBB">Concept site. Firm Ground Homes is a fictional organization. All numbers, quotes and images are samples or placeholders.</p>
</footer>

</div>
</template>
<div id="app"></div>
<script src="assets/dc-lite.js"></script>
<script>
class Component extends DCLogic {
state = { firstName: '', phone: '', email: '', callTime: '', work: '', note: '', consent: false, tried: false, done: false, doneName: '' };

renderVals() {
const s = this.state;
const phoneOk = s.phone.replace(/\D/g, '').length >= 7;
const nameError = s.tried && !s.firstName.trim();
const phoneError = s.tried && !phoneOk;
const workError = s.tried && !s.work;
const consentError = s.tried && !s.consent;
const ok = '#8F8575';
const bad = '#A8481F';
return {
firstName: s.firstName,
phone: s.phone,
email: s.email,
callTime: s.callTime,
work: s.work,
note: s.note,
consent: s.consent,
nameError, phoneError, workError, consentError,
nameBorder: nameError ? bad : ok,
phoneBorder: phoneError ? bad : ok,
workBorder: workError ? bad : ok,
showForm: !s.done,
showConfirm: s.done,
confirmName: s.doneName,
onFirstName: (e) => this.setState({ firstName: e.target.value }),
onPhone: (e) => this.setState({ phone: e.target.value }),
onEmail: (e) => this.setState({ email: e.target.value }),
onCallTime: (e) => this.setState({ callTime: e.target.value }),
onWork: (e) => this.setState({ work: e.target.value }),
onNote: (e) => this.setState({ note: e.target.value }),
onConsent: (e) => this.setState({ consent: e.target.checked }),
submit: (e) => {
if (e && e.preventDefault) e.preventDefault();
const c = this.state;
const valid = c.firstName.trim() && c.phone.replace(/\D/g, '').length >= 7 && c.work && c.consent;
if (valid) {
this.setState({ tried: true, done: true, doneName: c.firstName.trim() });
} else {
this.setState({ tried: true });
}
},
reset: () => this.setState({ firstName: '', phone: '', email: '', callTime: '', work: '', note: '', consent: false, tried: false, done: false, doneName: '' })
};
}
}
DC.mount(Component);
</script>
<noscript><p style="padding:24px">This sample form needs JavaScript.</p></noscript>
</body>
</html>
