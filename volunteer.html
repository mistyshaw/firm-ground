<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Firm Ground Homes: Volunteer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&amp;family=Source+Sans+3:wght@400;600;700&amp;display=swap">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<template id="dc-tpl">

<div class="site">

<div class="concept-banner"><strong>Concept site.</strong> Firm Ground Homes is a fictional organization created as a design sample.</div>

<header class="site-header">
<a href="index.html" class="site-logo">
<svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="10" fill="#1F5C5A"/><path d="M9 18 L18 10 L27 18 M12 17v9h12v-9" fill="none" stroke="#FBF6EC" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
<span class="site-logo__name">Firm Ground Homes</span>
</a>
<nav aria-label="Main" class="site-nav">
<a href="about.html" class="site-nav__link">About</a>
<a href="programs.html" class="site-nav__link">Programs</a>
<a href="apply.html" class="site-nav__link">How to apply</a>
<a href="referral.html" class="site-nav__link">For referral partners</a>
<a href="volunteer.html" aria-current="page" class="site-nav__link site-nav__link--current">Volunteer</a>
<a href="faq.html" class="site-nav__link">Questions</a>
<a href="donate.html" class="site-nav__link">Donate</a>
</nav>
</header>

<main>
<section class="page-hero">
<p class="eyebrow">Volunteer</p>
<h1 class="page-title">Give your time, help someone get steady.</h1>
<p class="page-lead">Volunteers help our homes run well and help residents move forward. Pick a role that fits your schedule and skills.</p>
<a href="#signup" class="button button--primary button--wide">Sign up to volunteer</a>
</section>

<section class="band-section">
<div class="container">
<p class="eyebrow">Ways to help</p>
<h2 class="section-title">Roles</h2>
<div class="card-grid">

<div class="role-card">
<div class="icon-tile">
<svg width="32" height="32" viewBox="0 0 40 40" aria-hidden="true"><circle cx="15" cy="14" r="5" fill="none" stroke="#1F5C5A" stroke-width="2.4"/><path d="M6 31c0-6 4-10 9-10s9 4 9 10" fill="none" stroke="#1F5C5A" stroke-width="2.4" stroke-linecap="round"/><circle cx="28" cy="16" r="4" fill="none" stroke="#1F5C5A" stroke-width="2.4"/><path d="M27 22c5 0 8 3 8 8" fill="none" stroke="#1F5C5A" stroke-width="2.4" stroke-linecap="round"/></svg>
</div>
<h3 class="card-heading">Mentor</h3>
<p class="card-intro">Meet with a resident once a week to talk through goals for work, school and the next home. Mentors are not counselors.</p>
<span class="role-card__duration">1 hour a week</span>
</div>

<div class="role-card">
<div class="icon-tile">
<svg width="32" height="32" viewBox="0 0 40 40" aria-hidden="true"><path d="M6 14l14-7 14 7v16l-14 7-14-7z" fill="none" stroke="#1F5C5A" stroke-width="2.4" stroke-linejoin="round"/><path d="M6 14l14 7 14-7M20 21v16" fill="none" stroke="#1F5C5A" stroke-width="2.4" stroke-linejoin="round"/></svg>
</div>
<h3 class="card-heading">Move-in helper</h3>
<p class="card-intro">Help new residents carry in belongings, set up their space and learn the house routines.</p>
<span class="role-card__duration">2 hours, as needed</span>
</div>

<div class="role-card">
<div class="icon-tile">
<svg width="32" height="32" viewBox="0 0 40 40" aria-hidden="true"><path d="M10 5h14l8 8v22H10z" fill="none" stroke="#1F5C5A" stroke-width="2.4" stroke-linejoin="round"/><path d="M24 5v8h8M15 20h12M15 26h12M15 31h7" fill="none" stroke="#1F5C5A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
</div>
<h3 class="card-heading">Resume workshop leader</h3>
<p class="card-intro">Lead a short workshop on resumes, applications or interviews.</p>
<span class="role-card__duration">2 hours, once a month</span>
</div>

<div class="role-card">
<div class="icon-tile">
<svg width="32" height="32" viewBox="0 0 40 40" aria-hidden="true"><rect x="7" y="7" width="22" height="9" rx="2" fill="none" stroke="#1F5C5A" stroke-width="2.4"/><path d="M29 11h4v9H20v5" fill="none" stroke="#1F5C5A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="17" y="25" width="6" height="10" rx="2" fill="none" stroke="#1F5C5A" stroke-width="2.4"/></svg>
</div>
<h3 class="card-heading">Home repair day crew</h3>
<p class="card-intro">Join a group day of painting, cleaning and small repairs.</p>
<span class="role-card__duration">One Saturday a quarter</span>
</div>

</div>
</div>
</section>

<section class="page-section">
<div class="split-layout">
<div class="split-layout__heading">
<p class="eyebrow">Expectations</p>
<h2 class="split-layout__title">What we ask of volunteers</h2>
</div>
<div class="split-layout__content">
<ul class="expectations-list">
<li class="checklist__item">
<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true" class="icon--check"><circle cx="14" cy="14" r="13" fill="#E3EEEA" stroke="#1F5C5A" stroke-width="2"/><path d="M8 14.5l4 4 8-9" fill="none" stroke="#1F5C5A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
<span>Show up when you say you will</span>
</li>
<li class="checklist__item">
<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true" class="icon--check"><circle cx="14" cy="14" r="13" fill="#E3EEEA" stroke="#1F5C5A" stroke-width="2"/><path d="M8 14.5l4 4 8-9" fill="none" stroke="#1F5C5A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
<span>Respect residents' privacy: no photos without permission, and what you learn here stays here</span>
</li>
<li class="checklist__item">
<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true" class="icon--check"><circle cx="14" cy="14" r="13" fill="#E3EEEA" stroke="#1F5C5A" stroke-width="2"/><path d="M8 14.5l4 4 8-9" fill="none" stroke="#1F5C5A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
<span>Complete a short orientation</span>
</li>
<li class="checklist__item--flush">
<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true" class="icon--check"><circle cx="14" cy="14" r="13" fill="#E3EEEA" stroke="#1F5C5A" stroke-width="2"/><path d="M8 14.5l4 4 8-9" fill="none" stroke="#1F5C5A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
<span>Complete a background check for roles with regular resident contact</span>
</li>
</ul>
<p class="concept-note"><strong>Concept note:</strong> <em>Client to confirm orientation and background check requirements with their board or counsel.</em></p>
</div>
</div>
</section>

<section id="signup" class="band-section">
<div class="sample-form-card">
<h2 class="form-card__title">Sign-up form</h2>
<p class="form-card__intro">Tell us a little about you. A volunteer coordinator will follow up.</p>

<sc-if value="{{ showConfirm }}" hint-placeholder-val="{{ false }}">
<div role="status" class="confirmation-panel">
<svg width="40" height="40" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="13" fill="#1F5C5A"/><path d="M8 14.5l4 4 8-9" fill="none" stroke="#FBF6EC" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
<p class="confirmation-panel__message">Thank you, {{ confirmName }}. We received your sign-up. A volunteer coordinator will email you within 5 business days. (Sample.)</p>
<button type="button" onClick="{{ reset }}" class="button button--outline button--small">Reset the sample form</button>
</div>
</sc-if>

<sc-if value="{{ showForm }}" hint-placeholder-val="{{ true }}">
<form onSubmit="{{ submit }}">

<div class="form-field">
<label for="v-first" class="form-field__label">First name <span class="form-field__hint">(required)</span></label>
<input id="v-first" type="text" autocomplete="given-name" value="{{ firstName }}" onChange="{{ onFirstName }}" aria-invalid="{{ firstNameError }}" class="text-input {{ firstNameBorder }}">
<sc-if value="{{ firstNameError }}" hint-placeholder-val="{{ false }}">
<p role="alert" class="form-field__error">Please add your first name.</p>
</sc-if>
</div>

<div class="form-field">
<label for="v-email" class="form-field__label">Email <span class="form-field__hint">(required)</span></label>
<input id="v-email" type="text" inputmode="email" autocomplete="email" value="{{ email }}" onChange="{{ onEmail }}" aria-invalid="{{ emailError }}" class="text-input {{ emailBorder }}">
<sc-if value="{{ emailError }}" hint-placeholder-val="{{ false }}">
<p role="alert" class="form-field__error">Please add an email so we can reach you.</p>
</sc-if>
</div>

<div class="form-field">
<label for="v-phone" class="form-field__label">Phone <span class="form-field__hint">(optional)</span></label>
<input id="v-phone" type="tel" autocomplete="tel" value="{{ phone }}" onChange="{{ onPhone }}" class="text-input">
</div>

<div class="form-field">
<label for="v-role" class="form-field__label">Role you are interested in <span class="form-field__hint">(optional)</span></label>
<select id="v-role" value="{{ role }}" onChange="{{ onRole }}" class="select-input">
<option value="">Choose a role</option>
<option value="Mentor">Mentor</option>
<option value="Move-in helper">Move-in helper</option>
<option value="Resume workshop leader">Resume workshop leader</option>
<option value="Home repair day crew">Home repair day crew</option>
<option value="Not sure yet">Not sure yet</option>
</select>
</div>

<div class="form-field">
<label for="v-free" class="form-field__label">When you are usually free <span class="form-field__hint">(optional)</span></label>
<select id="v-free" value="{{ free }}" onChange="{{ onFree }}" class="select-input">
<option value="">Choose one</option>
<option value="Weekdays">Weekdays</option>
<option value="Evenings">Evenings</option>
<option value="Weekends">Weekends</option>
<option value="It varies">It varies</option>
</select>
</div>

<div class="form-field">
<label for="v-note" class="form-field__label">Anything you want us to know <span class="form-field__hint">(optional)</span></label>
<textarea id="v-note" rows="4" value="{{ note }}" onChange="{{ onNote }}" class="textarea-input"></textarea>
</div>

<div class="form-field">
<div class="checklist__item--flush">
<input id="v-consent" type="checkbox" checked="{{ consent }}" onChange="{{ onConsent }}" aria-invalid="{{ consentError }}" class="consent-checkbox">
<label for="v-consent" class="consent-label">OK to contact me about volunteering <span class="form-field__hint">(required)</span></label>
</div>
<sc-if value="{{ consentError }}" hint-placeholder-val="{{ false }}">
<p role="alert" class="form-field__error">Please check the box so we can contact you.</p>
</sc-if>
</div>

<p class="form-info-note">We only use your details to contact you about volunteering.</p>

<button type="submit" class="button button--primary button--wide">Sign me up</button>
<p class="form-footnote">Concept site: nothing typed here is sent or saved.</p>
</form>
</sc-if>
</div>
</section>
</main>

<footer class="site-footer">
<div class="site-footer__inner">
<div class="site-footer__column">
<div class="site-footer__brand">Firm Ground Homes</div>
<p class="site-footer__text">Steady ground while you rebuild.</p>
</div>
<div class="site-footer__column">
<h2 class="site-footer__heading">Need help right now?</h2>
<p class="site-footer__text">Call or text 988, or dial 211 for local services.</p>
</div>
<div class="site-footer__column">
<h2 class="site-footer__heading">Accessibility</h2>
<p class="site-footer__text">We build this site to meet WCAG 2.1 AA. If something is hard to use, tell us and we will fix it.</p>
</div>
</div>
<p class="site-footer__disclaimer">Concept site. Firm Ground Homes is a fictional organization. All numbers, quotes and images are samples or placeholders.</p>
</footer>

</div>
</template>
<div id="app"></div>
<script src="assets/dc-lite.js"></script>
<script>
class Component extends DCLogic {
state = { firstName: '', email: '', phone: '', role: '', free: '', note: '', consent: false, tried: false, done: false, doneName: '' };

errors(c) {
return {
firstName: !c.firstName.trim(),
email: !/^\S+@\S+\.\S+$/.test(c.email.trim()),
consent: !c.consent
};
}

renderVals() {
const s = this.state;
const er = this.errors(s);
const t = s.tried;
const ok = '#8F8575';
const bad = '#A8481F';
const on = (k) => (e) => this.setState({ [k]: e.target.value });
return {
firstName: s.firstName,
email: s.email,
phone: s.phone,
role: s.role,
free: s.free,
note: s.note,
consent: s.consent,
firstNameError: t && er.firstName,
emailError: t && er.email,
consentError: t && er.consent,
firstNameBorder: t && er.firstName ? 'is-invalid' : '',
emailBorder: t && er.email ? 'is-invalid' : '',
showForm: !s.done,
showConfirm: s.done,
confirmName: s.doneName,
onFirstName: on('firstName'),
onEmail: on('email'),
onPhone: on('phone'),
onRole: on('role'),
onFree: on('free'),
onNote: on('note'),
onConsent: (e) => this.setState({ consent: e.target.checked }),
submit: (e) => {
if (e && e.preventDefault) e.preventDefault();
const c = this.state;
const errs = this.errors(c);
const valid = !Object.values(errs).some(Boolean);
if (valid) {
this.setState({ tried: true, done: true, doneName: c.firstName.trim() });
} else {
this.setState({ tried: true });
}
},
reset: () => this.setState({ firstName: '', email: '', phone: '', role: '', free: '', note: '', consent: false, tried: false, done: false, doneName: '' })
};
}
}
DC.mount(Component);
</script>
<noscript><p class="noscript-message">This sample form needs JavaScript.</p></noscript>
</body>
</html>
