<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Firm Ground Homes: Volunteer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&amp;family=Source+Sans+3:wght@400;600;700&amp;display=swap">
<style>
body{margin:0;background:#FBF6EC;color:#2B2A28;font-family:'Source Sans 3',system-ui,sans-serif;font-size:18px;line-height:1.6}
a{color:#1F5C5A}
a:hover{text-decoration:underline}
a:focus-visible{outline:3px solid #A8481F;outline-offset:3px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid #A8481F;outline-offset:2px}
.btn:hover{text-decoration:none}
.btn-clay:hover{background:#8C3A15 !important}
.btn-teal:hover{background:#134240 !important}
.btn-line:hover{background:#E3EEEA !important}
.btn-cream:hover{background:#F3EAD8 !important}
</style>
</head>
<body>
<template id="dc-tpl">

<div style="width: 100%; background: #FBF6EC; color: #2B2A28; font-family: 'Source Sans 3', system-ui, sans-serif; font-size: 18px; line-height: 1.6">

<div style="background: #2B2A28; color: #FBF6EC; font-size: 15px; line-height: 1.4; padding: 10px 24px; text-align: center"><strong>Concept site.</strong> Firm Ground Homes is a fictional organization created as a design sample.</div>

<header style="max-width: 1120px; margin: 0 auto; padding: 20px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 32px">
<a href="index.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #1F5C5A">
<svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="10" fill="#1F5C5A"/><path d="M9 18 L18 10 L27 18 M12 17v9h12v-9" fill="none" stroke="#FBF6EC" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
<span style="font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 24px; line-height: 1.1">Firm Ground Homes</span>
</a>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 20px">
<a href="about.html" style="padding: 10px 6px; color: #2B2A28; font-weight: 600; font-size: 17px; text-decoration: none">About</a>
<a href="programs.html" style="padding: 10px 6px; color: #2B2A28; font-weight: 600; font-size: 17px; text-decoration: none">Programs</a>
<a href="apply.html" style="padding: 10px 6px; color: #2B2A28; font-weight: 600; font-size: 17px; text-decoration: none">How to apply</a>
<a href="referral.html" style="padding: 10px 6px; color: #2B2A28; font-weight: 600; font-size: 17px; text-decoration: none">For referral partners</a>
<a href="volunteer.html" aria-current="page" style="padding: 10px 6px; color: #1F5C5A; font-weight: 700; font-size: 17px; text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 8px; text-decoration-color: #A8481F">Volunteer</a>
<a href="faq.html" style="padding: 10px 6px; color: #2B2A28; font-weight: 600; font-size: 17px; text-decoration: none">Questions</a>
<a href="donate.html" style="padding: 10px 6px; color: #2B2A28; font-weight: 600; font-size: 17px; text-decoration: none">Donate</a>
</nav>
</header>

<main>
<section style="max-width: 1120px; margin: 0 auto; padding: 48px 24px 56px">
<p style="margin: 0 0 12px; font-size: 14px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #A8481F">Volunteer</p>
<h1 style="margin: 0 0 20px; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: clamp(38px, 5.5vw, 58px); line-height: 1.1; color: #1F5C5A">Give your time, help someone get steady.</h1>
<p style="margin: 0 0 32px; max-width: 34em; font-size: 21px; line-height: 1.5; color: #3B3935">Volunteers help our homes run well and help residents move forward. Pick a role that fits your schedule and skills.</p>
<a class="btn btn-clay" href="#signup" style="display: inline-flex; align-items: center; justify-content: center; min-height: 56px; min-width: 230px; padding: 0 32px; border-radius: 999px; background: #A8481F; color: #FFFFFF; font-size: 18px; font-weight: 700; text-decoration: none; border: 2px solid #A8481F; box-sizing: border-box">Sign up to volunteer</a>
</section>

<section style="background: #F4EAD6; padding: 72px 24px">
<div style="max-width: 1120px; margin: 0 auto">
<p style="margin: 0 0 12px; font-size: 14px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #A8481F">Ways to help</p>
<h2 style="margin: 0 0 36px; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: clamp(30px, 4vw, 40px); line-height: 1.15; color: #1F5C5A">Roles</h2>
<div style="display: flex; flex-wrap: wrap; gap: 24px">

<div style="flex: 1 1 240px; min-width: 0; background: #FFFDF8; border: 1px solid #E6D9BF; border-radius: 20px; padding: 28px; display: flex; flex-direction: column">
<div style="width: 56px; height: 56px; border-radius: 16px; background: #E3EEEA; display: flex; align-items: center; justify-content: center; margin-bottom: 16px">
<svg width="32" height="32" viewBox="0 0 40 40" aria-hidden="true"><circle cx="15" cy="14" r="5" fill="none" stroke="#1F5C5A" stroke-width="2.4"/><path d="M6 31c0-6 4-10 9-10s9 4 9 10" fill="none" stroke="#1F5C5A" stroke-width="2.4" stroke-linecap="round"/><circle cx="28" cy="16" r="4" fill="none" stroke="#1F5C5A" stroke-width="2.4"/><path d="M27 22c5 0 8 3 8 8" fill="none" stroke="#1F5C5A" stroke-width="2.4" stroke-linecap="round"/></svg>
</div>
<h3 style="margin: 0 0 8px; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 24px; line-height: 1.2; color: #2B2A28">Mentor</h3>
<p style="margin: 0 0 16px">Meet with a resident once a week to talk through goals for work, school and the next home. Mentors are not counselors.</p>
<span style="margin-top: auto; align-self: flex-start; padding: 4px 14px; border-radius: 999px; background: #E3EEEA; color: #1F5C5A; font-size: 15px; font-weight: 700">1 hour a week</span>
</div>

<div style="flex: 1 1 240px; min-width: 0; background: #FFFDF8; border: 1px solid #E6D9BF; border-radius: 20px; padding: 28px; display: flex; flex-direction: column">
<div style="width: 56px; height: 56px; border-radius: 16px; background: #E3EEEA; display: flex; align-items: center; justify-content: center; margin-bottom: 16px">
<svg width="32" height="32" viewBox="0 0 40 40" aria-hidden="true"><path d="M6 14l14-7 14 7v16l-14 7-14-7z" fill="none" stroke="#1F5C5A" stroke-width="2.4" stroke-linejoin="round"/><path d="M6 14l14 7 14-7M20 21v16" fill="none" stroke="#1F5C5A" stroke-width="2.4" stroke-linejoin="round"/></svg>
</div>
<h3 style="margin: 0 0 8px; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 24px; line-height: 1.2; color: #2B2A28">Move-in helper</h3>
<p style="margin: 0 0 16px">Help new residents carry in belongings, set up their space and learn the house routines.</p>
<span style="margin-top: auto; align-self: flex-start; padding: 4px 14px; border-radius: 999px; background: #E3EEEA; color: #1F5C5A; font-size: 15px; font-weight: 700">2 hours, as needed</span>
</div>

<div style="flex: 1 1 240px; min-width: 0; background: #FFFDF8; border: 1px solid #E6D9BF; border-radius: 20px; padding: 28px; display: flex; flex-direction: column">
<div style="width: 56px; height: 56px; border-radius: 16px; background: #E3EEEA; display: flex; align-items: center; justify-content: center; margin-bottom: 16px">
<svg width="32" height="32" viewBox="0 0 40 40" aria-hidden="true"><path d="M10 5h14l8 8v22H10z" fill="none" stroke="#1F5C5A" stroke-width="2.4" stroke-linejoin="round"/><path d="M24 5v8h8M15 20h12M15 26h12M15 31h7" fill="none" stroke="#1F5C5A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
</div>
<h3 style="margin: 0 0 8px; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 24px; line-height: 1.2; color: #2B2A28">Resume workshop leader</h3>
<p style="margin: 0 0 16px">Lead a short workshop on resumes, applications or interviews.</p>
<span style="margin-top: auto; align-self: flex-start; padding: 4px 14px; border-radius: 999px; background: #E3EEEA; color: #1F5C5A; font-size: 15px; font-weight: 700">2 hours, once a month</span>
</div>

<div style="flex: 1 1 240px; min-width: 0; background: #FFFDF8; border: 1px solid #E6D9BF; border-radius: 20px; padding: 28px; display: flex; flex-direction: column">
<div style="width: 56px; height: 56px; border-radius: 16px; background: #E3EEEA; display: flex; align-items: center; justify-content: center; margin-bottom: 16px">
<svg width="32" height="32" viewBox="0 0 40 40" aria-hidden="true"><rect x="7" y="7" width="22" height="9" rx="2" fill="none" stroke="#1F5C5A" stroke-width="2.4"/><path d="M29 11h4v9H20v5" fill="none" stroke="#1F5C5A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="17" y="25" width="6" height="10" rx="2" fill="none" stroke="#1F5C5A" stroke-width="2.4"/></svg>
</div>
<h3 style="margin: 0 0 8px; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 24px; line-height: 1.2; color: #2B2A28">Home repair day crew</h3>
<p style="margin: 0 0 16px">Join a group day of painting, cleaning and small repairs.</p>
<span style="margin-top: auto; align-self: flex-start; padding: 4px 14px; border-radius: 999px; background: #E3EEEA; color: #1F5C5A; font-size: 15px; font-weight: 700">One Saturday a quarter</span>
</div>

</div>
</div>
</section>

<section style="max-width: 1120px; margin: 0 auto; padding: 72px 24px">
<div style="display: flex; flex-wrap: wrap; gap: 32px 56px; align-items: flex-start">
<div style="flex: 1 1 280px; min-width: 0">
<p style="margin: 0 0 12px; font-size: 14px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #A8481F">Expectations</p>
<h2 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: clamp(30px, 4vw, 40px); line-height: 1.15; color: #1F5C5A">What we ask of volunteers</h2>
</div>
<div style="flex: 2 1 420px; min-width: 0; max-width: 40em">
<ul style="margin: 0 0 28px; padding: 0; list-style: none">
<li style="display: flex; gap: 14px; align-items: flex-start; margin-bottom: 14px">
<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="14" cy="14" r="13" fill="#E3EEEA" stroke="#1F5C5A" stroke-width="2"/><path d="M8 14.5l4 4 8-9" fill="none" stroke="#1F5C5A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
<span>Show up when you say you will</span>
</li>
<li style="display: flex; gap: 14px; align-items: flex-start; margin-bottom: 14px">
<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="14" cy="14" r="13" fill="#E3EEEA" stroke="#1F5C5A" stroke-width="2"/><path d="M8 14.5l4 4 8-9" fill="none" stroke="#1F5C5A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
<span>Respect residents' privacy: no photos without permission, and what you learn here stays here</span>
</li>
<li style="display: flex; gap: 14px; align-items: flex-start; margin-bottom: 14px">
<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="14" cy="14" r="13" fill="#E3EEEA" stroke="#1F5C5A" stroke-width="2"/><path d="M8 14.5l4 4 8-9" fill="none" stroke="#1F5C5A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
<span>Complete a short orientation</span>
</li>
<li style="display: flex; gap: 14px; align-items: flex-start">
<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="14" cy="14" r="13" fill="#E3EEEA" stroke="#1F5C5A" stroke-width="2"/><path d="M8 14.5l4 4 8-9" fill="none" stroke="#1F5C5A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
<span>Complete a background check for roles with regular resident contact</span>
</li>
</ul>
<p style="margin: 0; padding: 14px 18px; border: 1.5px dashed #8F8575; border-radius: 12px; font-size: 16px; line-height: 1.5; color: #3B3935"><strong>Concept note:</strong> <em>Client to confirm orientation and background check requirements with their board or counsel.</em></p>
</div>
</div>
</section>

<section id="signup" style="background: #F4EAD6; padding: 72px 24px">
<div style="max-width: 760px; margin: 0 auto; background: #FFFDF8; border: 1px solid #E6D9BF; border-top: 6px solid #1F5C5A; border-radius: 20px; padding: 32px">
<h2 style="margin: 0 0 8px; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: clamp(28px, 3.5vw, 34px); line-height: 1.2; color: #1F5C5A">Sign-up form</h2>
<p style="margin: 0 0 24px; color: #3B3935">Tell us a little about you. A volunteer coordinator will follow up.</p>

<sc-if value="{{ showConfirm }}" hint-placeholder-val="{{ false }}">
<div role="status" style="background: #E3EEEA; border: 2px solid #1F5C5A; border-radius: 16px; padding: 28px">
<svg width="40" height="40" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="13" fill="#1F5C5A"/><path d="M8 14.5l4 4 8-9" fill="none" stroke="#FBF6EC" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
<p style="margin: 12px 0 20px; font-size: 20px; line-height: 1.5">Thank you, {{ confirmName }}. We received your sign-up. A volunteer coordinator will email you within 5 business days. (Sample.)</p>
<button type="button" onClick="{{ reset }}" style="min-height: 44px; padding: 0 20px; border-radius: 999px; border: 2px solid #1F5C5A; background: transparent; color: #1F5C5A; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer">Reset the sample form</button>
</div>
</sc-if>

<sc-if value="{{ showForm }}" hint-placeholder-val="{{ true }}">
<form onSubmit="{{ submit }}">

<div style="margin-bottom: 22px">
<label for="v-first" style="display: block; margin-bottom: 6px; font-weight: 700">First name <span style="font-weight: 400; color: #55524C">(required)</span></label>
<input id="v-first" type="text" autocomplete="given-name" value="{{ firstName }}" onChange="{{ onFirstName }}" aria-invalid="{{ firstNameError }}" style="display: block; width: 100%; box-sizing: border-box; min-height: 52px; padding: 0 16px; border: 2px solid {{ firstNameBorder }}; border-radius: 12px; background: #FFFFFF; color: #2B2A28; font-family: inherit; font-size: 18px">
<sc-if value="{{ firstNameError }}" hint-placeholder-val="{{ false }}">
<p role="alert" style="margin: 8px 0 0; color: #8C3A15; font-size: 16px; font-weight: 700">Please add your first name.</p>
</sc-if>
</div>

<div style="margin-bottom: 22px">
<label for="v-email" style="display: block; margin-bottom: 6px; font-weight: 700">Email <span style="font-weight: 400; color: #55524C">(required)</span></label>
<input id="v-email" type="text" inputmode="email" autocomplete="email" value="{{ email }}" onChange="{{ onEmail }}" aria-invalid="{{ emailError }}" style="display: block; width: 100%; box-sizing: border-box; min-height: 52px; padding: 0 16px; border: 2px solid {{ emailBorder }}; border-radius: 12px; background: #FFFFFF; color: #2B2A28; font-family: inherit; font-size: 18px">
<sc-if value="{{ emailError }}" hint-placeholder-val="{{ false }}">
<p role="alert" style="margin: 8px 0 0; color: #8C3A15; font-size: 16px; font-weight: 700">Please add an email so we can reach you.</p>
</sc-if>
</div>

<div style="margin-bottom: 22px">
<label for="v-phone" style="display: block; margin-bottom: 6px; font-weight: 700">Phone <span style="font-weight: 400; color: #55524C">(optional)</span></label>
<input id="v-phone" type="tel" autocomplete="tel" value="{{ phone }}" onChange="{{ onPhone }}" style="display: block; width: 100%; box-sizing: border-box; min-height: 52px; padding: 0 16px; border: 2px solid #8F8575; border-radius: 12px; background: #FFFFFF; color: #2B2A28; font-family: inherit; font-size: 18px">
</div>

<div style="margin-bottom: 22px">
<label for="v-role" style="display: block; margin-bottom: 6px; font-weight: 700">Role you are interested in <span style="font-weight: 400; color: #55524C">(optional)</span></label>
<select id="v-role" value="{{ role }}" onChange="{{ onRole }}" style="display: block; width: 100%; box-sizing: border-box; min-height: 52px; padding: 0 12px; border: 2px solid #8F8575; border-radius: 12px; background: #FFFFFF; color: #2B2A28; font-family: inherit; font-size: 18px">
<option value="">Choose a role</option>
<option value="Mentor">Mentor</option>
<option value="Move-in helper">Move-in helper</option>
<option value="Resume workshop leader">Resume workshop leader</option>
<option value="Home repair day crew">Home repair day crew</option>
<option value="Not sure yet">Not sure yet</option>
</select>
</div>

<div style="margin-bottom: 22px">
<label for="v-free" style="display: block; margin-bottom: 6px; font-weight: 700">When you are usually free <span style="font-weight: 400; color: #55524C">(optional)</span></label>
<select id="v-free" value="{{ free }}" onChange="{{ onFree }}" style="display: block; width: 100%; box-sizing: border-box; min-height: 52px; padding: 0 12px; border: 2px solid #8F8575; border-radius: 12px; background: #FFFFFF; color: #2B2A28; font-family: inherit; font-size: 18px">
<option value="">Choose one</option>
<option value="Weekdays">Weekdays</option>
<option value="Evenings">Evenings</option>
<option value="Weekends">Weekends</option>
<option value="It varies">It varies</option>
</select>
</div>

<div style="margin-bottom: 22px">
<label for="v-note" style="display: block; margin-bottom: 6px; font-weight: 700">Anything you want us to know <span style="font-weight: 400; color: #55524C">(optional)</span></label>
<textarea id="v-note" rows="4" value="{{ note }}" onChange="{{ onNote }}" style="display: block; width: 100%; box-sizing: border-box; padding: 12px 16px; border: 2px solid #8F8575; border-radius: 12px; background: #FFFFFF; color: #2B2A28; font-family: inherit; font-size: 18px; line-height: 1.5; resize: vertical"></textarea>
</div>

<div style="margin-bottom: 22px">
<div style="display: flex; gap: 14px; align-items: flex-start">
<input id="v-consent" type="checkbox" checked="{{ consent }}" onChange="{{ onConsent }}" aria-invalid="{{ consentError }}" style="flex: none; width: 28px; height: 28px; margin: 2px 0 0; accent-color: #1F5C5A">
<label for="v-consent" style="font-weight: 600">OK to contact me about volunteering <span style="font-weight: 400; color: #55524C">(required)</span></label>
</div>
<sc-if value="{{ consentError }}" hint-placeholder-val="{{ false }}">
<p role="alert" style="margin: 8px 0 0; color: #8C3A15; font-size: 16px; font-weight: 700">Please check the box so we can contact you.</p>
</sc-if>
</div>

<p style="margin: 0 0 24px; padding: 14px 18px; background: #F4EAD6; border-radius: 12px; font-size: 16px; line-height: 1.5">We only use your details to contact you about volunteering.</p>

<button type="submit" style="display: inline-flex; align-items: center; justify-content: center; min-height: 56px; min-width: 230px; padding: 0 32px; border-radius: 999px; border: 2px solid #A8481F; background: #A8481F; color: #FFFFFF; font-family: inherit; font-size: 18px; font-weight: 700; cursor: pointer">Sign me up</button>
<p style="margin: 14px 0 0; font-size: 14px; line-height: 1.5; color: #55524C">Concept site: nothing typed here is sent or saved.</p>
</form>
</sc-if>
</div>
</section>
</main>

<footer style="background: #2B2A28; color: #F3EAD8; padding: 56px 24px 40px">
<div style="max-width: 1120px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 32px 56px">
<div style="flex: 1 1 260px; min-width: 0">
<div style="font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 24px; color: #FBF6EC; margin-bottom: 8px">Firm Ground Homes</div>
<p style="margin: 0; font-size: 16px; line-height: 1.5">Steady ground while you rebuild.</p>
</div>
<div style="flex: 1 1 260px; min-width: 0">
<h2 style="margin: 0 0 8px; font-size: 16px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #F4C46B">Need help right now?</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.5">Call or text 988, or dial 211 for local services.</p>
</div>
<div style="flex: 1 1 260px; min-width: 0">
<h2 style="margin: 0 0 8px; font-size: 16px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #F4C46B">Accessibility</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.5">We build this site to meet WCAG 2.1 AA. If something is hard to use, tell us and we will fix it.</p>
</div>
</div>
<p style="max-width: 1120px; margin: 40px auto 0; padding-top: 20px; border-top: 1px solid #55524C; font-size: 14px; line-height: 1.5; color: #D9CFBB">Concept site. Firm Ground Homes is a fictional organization. All numbers, quotes and images are samples or placeholders.</p>
</footer>

</div>
</template>
<div id="app"></div>
<script src="assets/dc-lite.js"></script>
<script>
class Component extends DCLogic {
state = { firstName: '', email: '', phone: '', role: '', free: '', note: '', consent: false, tried: false, done: false, doneName: '' };

errors(c) {
return {
firstName: !c.firstName.trim(),
email: !/^\S+@\S+\.\S+$/.test(c.email.trim()),
consent: !c.consent
};
}

renderVals() {
const s = this.state;
const er = this.errors(s);
const t = s.tried;
const ok = '#8F8575';
const bad = '#A8481F';
const on = (k) => (e) => this.setState({ [k]: e.target.value });
return {
firstName: s.firstName,
email: s.email,
phone: s.phone,
role: s.role,
free: s.free,
note: s.note,
consent: s.consent,
firstNameError: t && er.firstName,
emailError: t && er.email,
consentError: t && er.consent,
firstNameBorder: t && er.firstName ? bad : ok,
emailBorder: t && er.email ? bad : ok,
showForm: !s.done,
showConfirm: s.done,
confirmName: s.doneName,
onFirstName: on('firstName'),
onEmail: on('email'),
onPhone: on('phone'),
onRole: on('role'),
onFree: on('free'),
onNote: on('note'),
onConsent: (e) => this.setState({ consent: e.target.checked }),
submit: (e) => {
if (e && e.preventDefault) e.preventDefault();
const c = this.state;
const errs = this.errors(c);
const valid = !Object.values(errs).some(Boolean);
if (valid) {
this.setState({ tried: true, done: true, doneName: c.firstName.trim() });
} else {
this.setState({ tried: true });
}
},
reset: () => this.setState({ firstName: '', email: '', phone: '', role: '', free: '', note: '', consent: false, tried: false, done: false, doneName: '' })
};
}
}
